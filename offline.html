<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><link rel="manifest" href="manifest.json"><title>بدون شبكة | زاد</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;font-family:Tahoma,Arial,sans-serif;color:#fff}.app{height:100%;max-width:500px;margin:auto;position:relative;background:#000}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 14px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#000b,transparent)}a{color:#fff;text-decoration:none;background:#ffffff20;padding:10px 14px;border-radius:12px}.video{width:100%;height:100%;object-fit:contain}.info{position:absolute;bottom:25px;right:16px;left:16px;text-shadow:0 2px 10px #000}.info h2{font-size:17px}.info p{font-size:11px;color:#dce8ed}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:#b7c8cf}</style></head><body><main class="app"><div class="top"><b>بدون شبكة</b><a href="account.html">رجوع</a></div><div id="content" class="empty">جاري فتح المقطع...</div></main><script>function db(){return new Promise((a,b)=>{const r=indexedDB.open('zaadOfflineDB',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('videos'))r.result.createObjectStore('videos',{keyPath:'id'})};r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}async function start(){const id=new URLSearchParams(location.search).get('id'),d=await db(),v=await new Promise(r=>{const q=d.transaction('videos','readonly').objectStore('videos').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}),c=document.getElementById('content');if(!v){c.textContent='المقطع غير موجود في التنزيلات.';return}const u=URL.createObjectURL(v.blob);c.className='';c.innerHTML=`<video class="video" src="${u}" controls autoplay playsinline loop></video><div class="info"><h2></h2><p></p></div>`;c.querySelector('h2').textContent=v.title||'';c.querySelector('p').textContent=v.publisher||'زاد'}start();</script></body></html>
