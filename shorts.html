<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">

<title>المقاطع | زاد</title>

<style>
:root{
    --primary:#28b6eb;
    --primary-dark:#087da9;
    --glass:rgba(4,17,23,.52);
    --border:rgba(255,255,255,.16);
    --app-height:100dvh;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Tahoma,Arial,sans-serif;
    overscroll-behavior:none;
}

body{
    -webkit-user-select:none;
    user-select:none;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    position:relative;
    width:100%;
    height:var(--app-height);
    overflow:hidden;
    background:#000;
}

/* =========================
   FEED
========================= */

.feed{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

.short{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    transform:translate3d(0,100%,0);
    transition:transform 320ms cubic-bezier(.22,.61,.36,1);
    will-change:transform;
    backface-visibility:hidden;
}

.short.current{
    transform:translate3d(0,0,0);
    z-index:3;
}

.short.previous{
    transform:translate3d(0,-100%,0);
    z-index:2;
}

.short.next{
    transform:translate3d(0,100%,0);
    z-index:2;
}

.short video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

.videoShade{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.22) 0%,
            rgba(0,0,0,.04) 38%,
            rgba(0,0,0,.18) 63%,
            rgba(0,0,0,.94) 100%
        );
}

/* =========================
   VIDEO CONTENT
========================= */

.videoContent{
    position:absolute;
    z-index:8;
    right:16px;
    left:84px;
    bottom:calc(78px + env(safe-area-inset-bottom));
    color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.55);
    pointer-events:none;
}

.publisher{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:9px;
}

.publisherAvatar{
    width:38px;
    height:38px;
    flex:none;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:14px;
    font-weight:900;
    color:#fff;
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
    border:1px solid rgba(255,255,255,.32);
}

.publisherAvatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.publisherAvatar.hasImage{background:#fff;overflow:hidden;}
.downloadState{font-size:8px;color:#fff;text-align:center;max-width:54px;}
.publisherDetails{
    min-width:0;
}

.publisherName{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:13px;
    font-weight:800;
}

.publisherNameText{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* التوثيق */

.verifiedBadge{
    width:17px;
    height:17px;
    flex:none;
    display:inline-grid;
    place-items:center;
}

.verifiedBadge svg{
    width:17px;
    height:17px;
    overflow:visible;
}

.verifiedBadge .verifyShape{
    fill:#1da1f2;
    stroke:none;
}

.verifiedBadge .verifyCheck{
    fill:none;
    stroke:#fff;
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.publisherCategory{
    margin-top:3px;
    font-size:9px;
    color:#d1eaf4;
}

.videoTitle{
    margin-bottom:5px;
    font-size:16px;
    line-height:1.5;
    font-weight:900;
}

.videoDescription{
    font-size:11px;
    line-height:1.75;
    color:#f2f7f9;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    overflow:hidden;
}

.sourceInfo{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:8px;
    width:max-content;
    max-width:100%;
    padding:7px 9px;
    border-radius:9px;
    background:rgba(0,0,0,.34);
    border:1px solid rgba(255,255,255,.13);
    font-size:9px;
    color:#edf7fa;
}

.sourceInfo svg{
    width:13px;
    height:13px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
}

/* =========================
   HEADER
========================= */

.fixedHeader{
    position:absolute;
    z-index:50;
    top:0;
    right:0;
    left:0;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;
    color:#fff;
    font-size:18px;
    font-weight:900;
    pointer-events:auto;
}

.brandLogo{
    width:39px;
    height:39px;
    border-radius:13px;
    display:grid;
    place-items:center;
    color:#fff;
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
    box-shadow:0 8px 25px rgba(0,0,0,.26);
}

.fixedHeaderActions{
    display:flex;
    gap:7px;
    pointer-events:auto;
}

.glassButton{
    width:41px;
    height:41px;
    border-radius:13px;
    display:grid;
    place-items:center;
    border:1px solid var(--border);
    color:#fff;
    background:var(--glass);
    backdrop-filter:blur(13px);
    -webkit-backdrop-filter:blur(13px);
}

.glassButton svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   CATEGORIES
========================= */

.fixedCategories{
    position:absolute;
    z-index:49;
    top:calc(env(safe-area-inset-top) + 61px);
    right:0;
    left:0;
    display:flex;
    gap:7px;
    padding:7px 14px 10px;
    overflow-x:auto;
    scrollbar-width:none;
    touch-action:pan-x;
}

.fixedCategories::-webkit-scrollbar{
    display:none;
}

.categoryButton{
    flex:none;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    color:#fff;
    background:rgba(5,17,23,.38);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:11px;
    white-space:nowrap;
}

.categoryButton.active{
    background:#fff;
    color:#062d40;
    border-color:#fff;
    font-weight:bold;
}

/* =========================
   ACTIONS
========================= */

.fixedActions{
    position:absolute;
    z-index:52;
    left:12px;
    bottom:calc(82px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:13px;
}

.actionItem{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:#fff;
    font-size:8px;
}

.actionButton{
    width:46px;
    height:46px;
    border-radius:50%;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.17);
    color:#fff;
    background:rgba(4,17,23,.50);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:.15s;
}

.actionButton:active{
    transform:scale(.87);
}

.actionButton svg{
    width:21px;
    height:21px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.actionItem.active .actionButton{
    background:#fff;
    color:var(--primary-dark);
}

/* =========================
   PROGRESS
========================= */

.videoProgress{
    position:absolute;
    z-index:48;
    right:0;
    left:0;
    bottom:calc(64px + env(safe-area-inset-bottom));
    height:2px;
    background:rgba(255,255,255,.16);
    pointer-events:none;
}

.videoProgressFill{
    width:0;
    height:100%;
    background:#fff;
}

/* =========================
   BOTTOM NAV
========================= */

.fixedBottomNav{
    position:absolute;
    z-index:55;
    right:0;
    left:0;
    bottom:0;
    height:calc(64px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:linear-gradient(transparent,rgba(0,0,0,.94));
}

.navItem{
    border:0;
    background:none;
    color:#cbd9de;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:8px;
}

.navItem svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.navItem.active{
    color:#fff;
    font-weight:bold;
}

/* =========================
   SEARCH
========================= */

.searchOverlay{
    position:absolute;
    z-index:500;
    inset:0;
    display:none;
    color:#fff;
    background:#071218;
}

.searchOverlay.show{
    display:block;
}

.searchTop{
    padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
    display:flex;
    align-items:center;
    gap:9px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.searchClose{
    width:42px;
    height:42px;
    flex:none;
    border:0;
    border-radius:13px;
    display:grid;
    place-items:center;
    color:#fff;
    background:rgba(255,255,255,.08);
}

.searchClose svg{
    width:21px;
    height:21px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
}

.searchInputBox{
    height:44px;
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 13px;
    border-radius:14px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.08);
}

.searchInputBox svg{
    width:19px;
    height:19px;
    fill:none;
    stroke:#a9c0ca;
    stroke-width:2;
}

.searchInputBox input{
    width:100%;
    border:0;
    outline:0;
    color:#fff;
    background:transparent;
    font-size:13px;
    -webkit-user-select:text;
    user-select:text;
}

.searchInputBox input::placeholder{
    color:#8299a3;
}

.searchResults{
    height:calc(100% - 70px - env(safe-area-inset-top));
    overflow-y:auto;
    padding:14px;
}

.searchStart{
    min-height:65vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#91a8b2;
}

.searchStart svg{
    width:45px;
    height:45px;
    margin-bottom:14px;
    fill:none;
    stroke:#668692;
    stroke-width:1.4;
}

.searchStart h3{
    color:#fff;
    margin-bottom:6px;
}

.searchStart p{
    font-size:11px;
}

.searchResult{
    width:100%;
    margin-bottom:9px;
    padding:11px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    display:flex;
    align-items:center;
    gap:11px;
    color:#fff;
    text-align:right;
    background:rgba(255,255,255,.055);
}

.searchResultIcon{
    width:48px;
    height:58px;
    flex:none;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
}

.searchResultIcon svg{
    width:21px;
    height:21px;
    fill:none;
    stroke:#fff;
    stroke-width:1.8;
}

.searchResultContent{
    flex:1;
    min-width:0;
}

.searchResultTitle{
    margin-bottom:5px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.searchResultPublisher{
    display:flex;
    align-items:center;
    gap:4px;
    color:#9db2bb;
    font-size:9px;
}

.searchVerified{
    width:14px;
    height:14px;
    display:inline-flex;
}

.searchVerified svg{
    width:14px;
    height:14px;
}

.searchVerified .verifyShape{
    fill:#1da1f2;
}

.searchVerified .verifyCheck{
    fill:none;
    stroke:#fff;
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.noSearchResults{
    padding:80px 20px;
    text-align:center;
    color:#9eb1b9;
    font-size:12px;
}


/* =========================
   SOUND
========================= */

.soundNotice{
    position:absolute;
    z-index:80;
    top:calc(env(safe-area-inset-top) + 116px);
    left:50%;
    transform:translate(-50%,-10px);
    width:max-content;
    max-width:calc(100% - 30px);
    padding:9px 13px;
    border-radius:999px;
    color:#fff;
    background:rgba(5,18,24,.75);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    font-size:10px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

.soundNotice.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   LOADING
========================= */

.loadingScreen{
    position:absolute;
    inset:0;
    z-index:100;
    display:grid;
    place-items:center;
    color:#fff;
    background:radial-gradient(circle at top,#133d4d,#050d11 70%);
    transition:.25s;
}

.loadingScreen.hide{
    opacity:0;
    pointer-events:none;
}

.loaderContent{
    text-align:center;
}

.loaderLogo{
    width:67px;
    height:67px;
    margin:0 auto 15px;
    border-radius:22px;
    display:grid;
    place-items:center;
    color:#fff;
    font-size:27px;
    font-weight:900;
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
}

.loaderText{
    font-size:11px;
    color:#c7dce4;
}

/* =========================
   MESSAGE
========================= */

.messagePage{
    position:absolute;
    inset:0;
    z-index:15;
    display:grid;
    place-items:center;
    padding:30px;
    color:#fff;
    text-align:center;
    background:radial-gradient(circle at top,#12394a,#050d11 68%);
}

.messagePage h2{
    margin-bottom:8px;
}

.messagePage p{
    font-size:11px;
    line-height:1.8;
    color:#bfd3db;
}

.retryButton{
    margin-top:15px;
    padding:10px 18px;
    border:0;
    border-radius:12px;
    color:#063045;
    background:#fff;
    font-weight:bold;
}

/* =========================
   SOURCE MODAL
========================= */

.modal{
    position:fixed;
    z-index:1000;
    inset:0;
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:14px;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(5px);
}

.modal.show{
    display:flex;
}

.modalCard{
    width:min(480px,100%);
    padding:20px;
    border-radius:23px;
    background:#fff;
    color:#15323d;
}

.modalHandle{
    width:43px;
    height:4px;
    margin:0 auto 16px;
    border-radius:999px;
    background:#dce4e7;
}

.modalCard h3{
    margin-bottom:8px;
}

.modalCard p{
    color:#71848c;
    font-size:11px;
    line-height:1.8;
}

.modalButtons{
    margin-top:17px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.modalButton{
    padding:11px;
    border-radius:12px;
    border:1px solid #dfeaec;
    color:#193640;
    background:#f7fbfc;
}

.modalPrimary{
    color:#fff;
    background:var(--primary-dark);
    border-color:var(--primary-dark);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    z-index:2000;
    top:calc(env(safe-area-inset-top) + 72px);
    left:50%;
    transform:translate(-50%,-15px);
    max-width:calc(100% - 30px);
    padding:10px 15px;
    border-radius:999px;
    color:#073248;
    background:#fff;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
    font-size:10px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-height:680px){
    .fixedActions{
        gap:8px;
    }

    .actionButton{
        width:41px;
        height:41px;
    }

    .videoDescription{
        -webkit-line-clamp:1;
    }
}

@media(min-width:700px){
    body{
        background:#061319;
    }

    .app{
        width:500px;
        max-width:100%;
        margin:auto;
        box-shadow:0 0 90px rgba(0,0,0,.85);
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <main class="feed" id="feed"></main>

    <!-- العناصر العلوية ثابتة -->
    <header class="fixedHeader">

        <div class="brand">
            <div class="brandLogo">ز</div>
            <span>زاد</span>
        </div>

        <div class="fixedHeaderActions">

            <button
                class="glassButton"
                aria-label="بحث"
                onclick="openSearch()">

                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m20 20-4-4"/>
                </svg>

            </button>

        </div>

    </header>

    <div
        class="fixedCategories"
        id="categories">
    </div>

    <!-- الأزرار ثابتة -->
    <aside class="fixedActions">

        <div class="actionItem" id="likeAction">

            <button
                class="actionButton"
                onclick="toggleLike()">

                <svg viewBox="0 0 24 24">
                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
                </svg>

            </button>

            <span>إعجاب</span>

        </div>

        <div class="actionItem" id="saveAction">

            <button
                class="actionButton"
                onclick="toggleSave()">

                <svg viewBox="0 0 24 24">
                    <path d="M6 3h12v18l-6-4-6 4Z"/>
                </svg>

            </button>

            <span>حفظ</span>

        </div>

        <div class="actionItem" id="downloadAction">
            <button class="actionButton" id="downloadButton" onclick="downloadCurrentVideo()" aria-label="تنزيل بدون شبكة">
                <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            </button>
            <span class="downloadState" id="downloadLabel">تنزيل</span>
        </div>

        <div class="actionItem">

            <button
                class="actionButton"
                onclick="shareCurrentVideo()">

                <svg viewBox="0 0 24 24">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <path d="m8.6 10.5 6.8-4"/>
                    <path d="m8.6 13.5 6.8 4"/>
                </svg>

            </button>

            <span>مشاركة</span>

        </div>

        <div class="actionItem">

            <button
                class="actionButton"
                id="soundButton"
                onclick="toggleSound()">

                <svg viewBox="0 0 24 24">
                    <path d="M11 5 6 9H3v6h3l5 4Z"/>
                    <path d="M15 9a4 4 0 0 1 0 6"/>
                    <path d="M17.5 6.5a8 8 0 0 1 0 11"/>
                </svg>

            </button>

            <span>الصوت</span>

        </div>

        <div class="actionItem">

            <button
                class="actionButton"
                onclick="showSource()">

                <svg viewBox="0 0 24 24">
                    <path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4Z"/>
                    <path d="M8 4v16"/>
                </svg>

            </button>

            <span>المصدر</span>

        </div>

    </aside>

    <div class="videoProgress">
        <div
            class="videoProgressFill"
            id="progressFill">
        </div>
    </div>

    <nav class="fixedBottomNav">

        <a href="index.html" class="navItem">

            <svg viewBox="0 0 24 24">
                <path d="M3 10.5 12 3l9 7.5"/>
                <path d="M5 9.5V21h14V9.5"/>
                <path d="M9 21v-7h6v7"/>
            </svg>

            <span>الرئيسية</span>

        </a>

        <button class="navItem active">

            <svg viewBox="0 0 24 24">
                <rect x="4" y="3" width="16" height="18" rx="4"/>
                <path d="m10 9 5 3-5 3Z"/>
            </svg>

            <span>المقاطع</span>

        </button>

        <button
            class="navItem"
            onclick="showToast('قسم القرآن قريبًا')">

            <svg viewBox="0 0 24 24">
                <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Z"/>
                <path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"/>
            </svg>

/* =========================
   OFFLINE DOWNLOADS
========================= */
const ZAAD_DB = "zaadOfflineDB";
const ZAAD_STORE = "videos";
function openZaadDB(){
    return new Promise((resolve,reject)=>{
        const req=indexedDB.open(ZAAD_DB,1);
        req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(ZAAD_STORE)) req.result.createObjectStore(ZAAD_STORE,{keyPath:"id"}); };
        req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
    });
}
async function offlineHas(id){
    try{ const db=await openZaadDB(); return await new Promise(r=>{ const q=db.transaction(ZAAD_STORE,"readonly").objectStore(ZAAD_STORE).get(id); q.onsuccess=()=>r(!!q.result); q.onerror=()=>r(false); }); }catch(e){ return false; }
}
async function updateDownloadState(){
    const item=currentItem(), action=document.getElementById("downloadAction"), label=document.getElementById("downloadLabel");
    if(!item||!action||!label) return;
    const yes=await offlineHas(item.id);
    action.classList.toggle("active",yes); label.textContent=yes?"بدون شبكة":"تنزيل";
}
async function downloadCurrentVideo(){
    const item=currentItem(); if(!item) return;
    if(await offlineHas(item.id)){ showToast("المقطع محفوظ بدون شبكة"); return; }
    const label=document.getElementById("downloadLabel"), btn=document.getElementById("downloadButton");
    label.textContent="جاري..."; btn.disabled=true;
    try{
        const res=await fetch(item.video,{mode:"cors"});
        if(!res.ok) throw new Error("HTTP "+res.status);
        const blob=await res.blob();
        if(!blob.size) throw new Error("EMPTY");
        const db=await openZaadDB();
        await new Promise((resolve,reject)=>{ const tx=db.transaction(ZAAD_STORE,"readwrite"); tx.objectStore(ZAAD_STORE).put({...item,blob,downloadedAt:Date.now()}); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });
        showToast("تم تنزيل المقطع للعمل بدون شبكة");
    }catch(error){
        console.error(error); showToast("تعذر التنزيل؛ استخدم رابط MP4 مباشر يسمح بالتنزيل");
    }finally{ btn.disabled=false; updateDownloadState(); }
}

/* =========================
   CSV
========================= */

function parseCSV(text){

    const rows = [];

    let row = [];
    let value = "";
    let quoted = false;

    for(let i=0;i<text.length;i++){

        const char = text[i];
        const next = text[i+1];

        if(char === '"'){

            if(
                quoted &&
                next === '"'
            ){
                value += '"';
                i++;
            }
            else{
                quoted = !quoted;
            }

        }
        else if(
            char === "," &&
            !quoted
        ){

            row.push(value);
            value = "";

        }
        else if(
            (char === "\n" || char === "\r")
            &&
            !quoted
        ){

            if(
                char === "\r" &&
                next === "\n"
            ){
                i++;
            }

            row.push(value);
            value = "";

            if(
                row.some(
                    cell =>
                        String(cell).trim() !== ""
                )
            ){
                rows.push(row);
            }

            row = [];

        }
        else{
            value += char;
        }
    }

    row.push(value);

    if(
        row.some(
            cell =>
                String(cell).trim() !== ""
        )
    ){
        rows.push(row);
    }

    return rows;
}

/* =========================
   SHEET -> VIDEOS
========================= */

function convertRowsToVideos(rows){

    const result = [];

    rows.slice(1).forEach(
        (row,index)=>{

            const title =
                clean(row[0]);

            const description =
                clean(row[1]);

            const categoryText =
                clean(row[2]);

            const videoURL =
                clean(row[3]);

            const publisher =
                clean(row[4]) || "زاد";

            const source =
                clean(row[5]);

            const sourceURL =
                clean(row[6]);

            const status =
                clean(row[7])
                .toLowerCase();

            /*
               العمود I
            */

            const verifiedValue =
                clean(row[8])
                .toLowerCase();

            const isVerified =
                verifiedValue === "yes" ||
                verifiedValue === "true" ||
                verifiedValue === "1" ||
                verifiedValue === "نعم" ||
                verifiedValue === "موثق";

            const avatar = clean(row[9]);

            if(
                status === "no" ||
                status === "false" ||
                status === "0" ||
                status === "مخفي"
            ){
                return;
            }

            if(
                !title ||
                !videoURL
            ){
                return;
            }

            result.push({

                id:"sheet-" + index,

                title,
                description,

                category:
                    normalizeCategory(
                        categoryText
                    ),

                categoryLabel:
                    categoryText || "محتوى",

                video:
                    normalizeVideoURL(
                        videoURL
                    ),

                publisher,

                source,

                sourceURL,

                verified:
                    isVerified,

                avatar: safeMediaURL(avatar)
            });

        }
    );

    return result;
}

/* =========================
   DRIVE URL
========================= */

function normalizeVideoURL(url){

    url =
        String(url || "")
        .trim();

    const match =
        url.match(
            /drive\.google\.com\/file\/d\/([^/]+)/i
        );

    if(match){

        return (
            "https://drive.google.com/uc?export=download&id="
            +
            encodeURIComponent(match[1])
        );
    }

    try{

        const parsed =
            new URL(url);

        if(
            parsed.hostname.includes(
                "drive.google.com"
            )
            &&
            parsed.searchParams.get("id")
        ){

            return (
                "https://drive.google.com/uc?export=download&id="
                +
                encodeURIComponent(
                    parsed.searchParams.get("id")
                )
            );
        }

    }
    catch(error){}

    return url;
}

function normalizeCategory(value){

    const text =
        String(value || "")
        .trim()
        .toLowerCase();

    if(
        text.includes("قرآن") ||
        text.includes("القران") ||
        text === "quran"
    ){
        return "quran";
    }

    if(
        text.includes("سنة") ||
        text.includes("حديث") ||
        text === "hadith"
    ){
        return "hadith";
    }

    if(
        text.includes("أذكار") ||
        text.includes("اذكار") ||
        text.includes("ذكر")
    ){
        return "adhkar";
    }

    if(text.includes("سيرة")){
        return "seerah";
    }

    if(
        text.includes("قصص") ||
        text.includes("قصة")
    ){
        return "stories";
    }

    if(
        text.includes("تعلم") ||
        text.includes("تعلّم")
    ){
        return "learning";
    }

    return "reminders";
}

function categoryLabel(category){

    const labels = {

        adhkar:"الأذكار",
        seerah:"السيرة",

function normalizeSearchText(value){

function getCards(){

    return [
        ...document.querySelectorAll(
            ".short"
        )

function initPositions(){

    getCards().forEach(
        (card,index)=>{

            card.classList.remove(
                "previous",
                "current",
                "next"
            );

            card.style.transform = "";
            card.style.transition = "";

            if(index < currentIndex){

                card.classList.add(
                    "previous"
                );

            }
            else if(
                index === currentIndex
            ){

                card.classList.add(
                    "current"
                );

            }
            else{

                card.classList.add(
                    "next"
                );
            }

        }
    );
}

function updatePositions(){

    initPositions();

    updateFixedControls();

    playCurrentVideo();
}

function currentItem(){

    return visibleVideos[
        currentIndex

function currentVideo(){

    return (
        getCards()[currentIndex]

/* =========================
   PLAY / SOUND
========================= */

function playCurrentVideo(
    firstAttempt=false
){

    getCards().forEach(
        (card,index)=>{

            const video =
                card.querySelector(
                    "video"
                );

            if(!video){
                return;
            }

            if(index !== currentIndex){

                video.pause();
                return;
            }

            if(firstAttempt){

                soundMuted = false;
                video.muted = false;

            }
            else{

                video.muted =
                    soundMuted;
            }

            const promise =
                video.play();

            if(
                promise &&
                typeof promise.catch ===
                "function"
            ){

                promise.catch(
                    ()=>{

                        /*
                           Safari/Chrome قد يمنع
                           التشغيل التلقائي بالصوت.
                        */

                        video.muted = true;

                        video.play()
                            .catch(()=>{});

                        enableSoundOnFirstInteraction();

                        updateSoundIcon();
                    }
                );
            }

        }
    );

    updateFixedControls();
}

function enableSoundOnFirstInteraction(){

    if(waitingForSoundInteraction){
        return;
    }

    waitingForSoundInteraction =
        true;

    document
        .getElementById("soundNotice")
        .classList.add("show");

    const activateSound =
        ()=>{

            const video =
                currentVideo();

            if(video){

                soundMuted = false;

                video.muted = false;

                video.play()
                    .catch(()=>{});

                updateSoundIcon();
            }

            waitingForSoundInteraction =
                false;

            document
                .getElementById("soundNotice")
                .classList.remove("show");

            document.removeEventListener(
                "pointerdown",
                activateSound,
                true
            );
        };

    document.addEventListener(
        "pointerdown",
        activateSound,
        true
    );
}

function pauseAll(){

    document
        .querySelectorAll(
            ".short video"
        )
        .forEach(
            video => video.pause()
        );
}

/* =========================
   VIDEO EVENTS
========================= */

function bindVideoEvents(){

    document
        .querySelectorAll(
            ".short video"
        )
        .forEach(
            (video,index)=>{

                video.addEventListener(
                    "timeupdate",
                    ()=>{

                        if(
                            index !== currentIndex ||
                            !video.duration
                        ){
                            return;
                        }

                        const percentage =
                            (
                                video.currentTime /
                                video.duration
                            ) * 100;

                        document
                            .getElementById("progressFill")
                            .style.width =
                            percentage + "%";
                    }
                );

                video.addEventListener(
                    "click",
                    ()=>{

                        if(index !== currentIndex){
                            return;
                        }

                        if(
                            video.muted &&
                            !soundMuted
                        ){
                            video.muted = false;
                        }

                        if(video.paused){

                            video.play()
                                .catch(()=>{});

                        }
                        else{

                            video.pause();
                        }
                    }
                );

            }
        );
}

/* =========================
   FIXED STATES
========================= */

function updateFixedControls(){

/* =========================
   NEXT / PREVIOUS
========================= */

const TRANSITION_TIME = 320;

function nextVideo(){

    if(moving){
        return;
    }

    if(
        currentIndex >=
        visibleVideos.length - 1
    ){

        edgeBounce(-1);
        return;
    }

    moving = true;

    currentIndex++;

    updatePositions();

    setTimeout(
        ()=>{
            moving = false;
        },
        TRANSITION_TIME
    );
}

function previousVideo(){

    if(moving){
        return;
    }

    if(currentIndex <= 0){

        edgeBounce(1);
        return;
    }

    moving = true;

    currentIndex--;

    updatePositions();

    setTimeout(
        ()=>{
            moving = false;
        },
        TRANSITION_TIME
    );
}

/* =========================
   TOUCH
========================= */

let dragging = false;
let startY = 0;
let currentY = 0;
let startTime = 0;

function touchStart(event){

    if(
        moving ||
        event.touches.length !== 1
    ){
        return;
    }

    if(
        event.target.closest(
            "button,a,.fixedCategories,.fixedActions,.fixedBottomNav,.fixedHeader"
        )
    ){
        return;
    }

    dragging = true;

    startY =
        event.touches[0].clientY;

    currentY =
        startY;

    startTime =
        performance.now();
}

function touchMove(event){

    if(!dragging){
        return;
    }

    currentY =
        event.touches[0].clientY;

    let delta =
        currentY - startY;

    if(
        currentIndex === 0 &&
        delta > 0
    ){
        delta *= .20;
    }

    if(
        currentIndex ===
        visibleVideos.length - 1
        &&
        delta < 0
    ){
        delta *= .20;
    }

    moveCardsWithFinger(delta);

    event.preventDefault();
}

function touchEnd(){

    if(!dragging){
        return;
    }

    dragging = false;

    const delta =
        currentY - startY;

    const elapsed =
        Math.max(
            1,
            performance.now() -
            startTime
        );

    const velocity =
        Math.abs(delta) /
        elapsed;

    const threshold =
        Math.min(
            75,
            getHeight() * .10
        );

    const fastSwipe =
        velocity > .42 &&
        Math.abs(delta) > 25;

    clearInlineTransforms();

    if(
        delta < -threshold ||
        (
            delta < 0 &&
            fastSwipe
        )
    ){

        nextVideo();

    }
    else if(
        delta > threshold ||
        (
            delta > 0 &&
            fastSwipe
        )
    ){

        previousVideo();

    }
    else{

        updatePositions();
    }
}

function moveCardsWithFinger(delta){

    const cards =
        getCards();

    const current =
        cards[currentIndex];

    const previous =
        cards[currentIndex - 1];

    const next =
        cards[currentIndex + 1];

    const height =
        getHeight();

    if(current){

        current.style.transition =
            "none";

        current.style.transform =
            `translate3d(0,${delta}px,0)`;
    }

    if(
        delta < 0 &&
        next
    ){

        next.style.transition =
            "none";

        next.style.transform =
            `translate3d(0,${height + delta}px,0)`;
    }

    if(
        delta > 0 &&
        previous
    ){

        previous.style.transition =
            "none";

        previous.style.transform =
            `translate3d(0,${-height + delta}px,0)`;
    }
}

function clearInlineTransforms(){

    getCards().forEach(
        card =>{

            card.style.transition = "";
            card.style.transform = "";

        }
    );
}

function getHeight(){

    return (
        window.visualViewport
        ?.height
        ||
        window.innerHeight
    );
}

function edgeBounce(direction){

    const card =
        getCards()[currentIndex];

    if(!card){
        return;
    }

    card.style.transition =
        "transform 120ms ease";

    card.style.transform =
        `translate3d(0,${direction * 16}px,0)`;

    setTimeout(
        ()=>{

            card.style.transform =
                "translate3d(0,0,0)";

            setTimeout(
                ()=>{

                    card.style.transition = "";
                    card.style.transform = "";

                },
                130
            );

        },
        120
    );
}

/* =========================
   MOUSE WHEEL
========================= */

let wheelLocked = false;
let wheelAmount = 0;
let wheelTimer;

function wheelNavigation(event){

    if(
        document
        .getElementById("searchOverlay")
        .classList.contains("show")
    ){
        return;
    }

    event.preventDefault();

    if(wheelLocked){
        return;
    }

    wheelAmount +=
        event.deltaY;

    clearTimeout(wheelTimer);

    wheelTimer =
        setTimeout(
            ()=>{
                wheelAmount = 0;
            },
            150
        );

    if(
        Math.abs(wheelAmount) <
        45
    ){
        return;
    }

    wheelLocked = true;

    if(wheelAmount > 0){
        nextVideo();
    }
    else{
        previousVideo();
    }

    wheelAmount = 0;

    setTimeout(
        ()=>{
            wheelLocked = false;
        },
        390
    );
}

/* =========================
   LIKE
========================= */

function toggleLike(){

    const item =
        currentItem();

    if(!item){
        return;
    }

    if(liked.includes(item.id)){

        liked =
            liked.filter(
                id =>
                    id !== item.id

    }

    }

    localStorage.setItem(
        "zaadLikes",

    updateFixedControls();
}

/* =========================
   SAVE
========================= */

function toggleSave(){

    const item =
        currentItem();

    if(!item){
        return;
    }

    if(saved.includes(item.id)){

        saved =
            saved.filter(
                id =>
                    id !== item.id
            );

        showToast(
            "تم إلغاء الحفظ"
        );

    }
    else{

        saved.push(item.id);

        let points =
            Number(

        );
    }

    localStorage.setItem(
        "zaadSaved",
        JSON.stringify(saved)
    );

    updateFixedControls();
}

/* =========================
   SOUND
========================= */

function toggleSound(){

    const video =
        currentVideo();

    if(!video){
        return;
    }

    if(
        soundMuted ||
        video.muted
    ){

        soundMuted = false;

        video.muted = false;

        video.play()
            .catch(()=>{});

        document
            .getElementById("soundNotice")
            .classList.remove("show");

        showToast(

    }
    else{

        video.muted = true;

        showToast(

    updateSoundIcon();
}

}

/* =========================
   SHARE
========================= */

async function shareCurrentVideo(){

    const item =
        currentItem();

    if(!item){
        return;
    }

    const text =
        item.title +
        (
            item.description
            ? "\n\n" + item.description
            : ""
        ) +
        (
            item.source
            ? "\n\nالمصدر: " + item.source
            : ""
        );

    if(navigator.share){

        try{

            await navigator.share({
                title:item.title,
                text:text
            });

        }
        catch(error){}

    }
    else{

        try{

            await navigator.clipboard
                .writeText(text);

            showToast(
                "تم نسخ معلومات المقطع"
            );

        }
        catch(error){

            showToast(
                "تعذرت المشاركة"
            );
        }
    }
}

   SOURCE
========================= */

function showSource(){

    const item =
        currentItem();

    if(!item){
        return;
    }

    pauseAll();

    document
        .getElementById("sourceText")
        .textContent =
        item.source ||
        "لم يتم إضافة مصدر لهذا المقطع.";

    document
        .getElementById("sourceOpenButton")
        .style.display =
        item.sourceURL
        ? "block"
        : "none";

    document
        .getElementById("sourceModal")
        .classList.add("show");
}

function closeSource(){

    document
        .getElementById("sourceModal")
        .classList.remove("show");

    playCurrentVideo();
}

function closeSourceBackground(event){

    if(event.target.id === "sourceModal"){
        closeSource();
    }
}

function openSource(){

    const item =
        currentItem();

    if(
        !item ||
        !item.sourceURL
    ){
        return;
    }

    try{

        const url =
            new URL(item.sourceURL);

        if(
            url.protocol !== "https:" &&
            url.protocol !== "http:"
        ){
            throw new Error();
        }

        window.open(
            url.href,
            "_blank",
            "noopener,noreferrer"
        );

    }
    catch(error){

        showToast(
            "رابط المصدر غير صحيح"
        );
    }
}

/* =========================
   HELPERS
========================= */

function readStorageArray(key){

    try{

        const value =
            JSON.parse(
                localStorage.getItem(
                    key
                ) || "[]"
            );

        return Array.isArray(value)
            ? value
            : [];

    }
    catch(error){

        return [];
    }
}

function clean(value){

    return String(
        value ?? ""
    ).trim();
}

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value ?? "");

    return div.innerHTML;
}

function safeMediaURL(value){
    const text = String(value || "").trim();
    if(!text) return "";
    try{
        const url = new URL(text, location.href);
        return (url.protocol === "https:" || url.protocol === "http:" || url.protocol === "data:") ? url.href : "";
    }catch(error){ return ""; }
}

function safeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

            previousVideo();

            !document
            .getElementById("searchOverlay")
            .classList.contains("show")
