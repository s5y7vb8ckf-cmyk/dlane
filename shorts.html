<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>المقاطع | زاد</title>

<style>
:root{
    --primary:#2eb7eb;
    --primary-dark:#087fae;
    --white:#ffffff;
    --glass:rgba(5,17,23,.50);
    --border:rgba(255,255,255,.17);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    overscroll-behavior:none;

    -webkit-user-select:none;
    user-select:none;
}

button{
    font:inherit;
}

button,
a{
    -webkit-tap-highlight-color:transparent;
}

/* =====================================================
   APP
===================================================== */

.app{
    position:relative;

    width:100%;
    height:100vh;
    height:100dvh;

    overflow:hidden;

    background:#000;
}

/* =====================================================
   FEED
===================================================== */

.feed{
    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    touch-action:none;

    overscroll-behavior:none;
}

/* =====================================================
   SHORT
===================================================== */

.short{
    position:absolute;

    inset:0;

    width:100%;

    height:100vh;
    height:100dvh;

    overflow:hidden;

    background:#000;

    transform:
        translate3d(
            0,
            100%,
            0
        );

    transition:
        transform
        320ms
        cubic-bezier(
            .22,
            .61,
            .36,
            1
        );

    will-change:transform;

    backface-visibility:hidden;

    -webkit-backface-visibility:hidden;
}

.short.current{
    transform:
        translate3d(
            0,
            0,
            0
        );

    z-index:3;
}

.short.previous{
    transform:
        translate3d(
            0,
            -100%,
            0
        );

    z-index:2;
}

.short.next{
    transform:
        translate3d(
            0,
            100%,
            0
        );

    z-index:2;
}

/* =====================================================
   VIDEO
===================================================== */

.short video{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;
}

/* =====================================================
   SHADE
===================================================== */

.shade{
    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,

            rgba(0,0,0,.48)
            0%,

            rgba(0,0,0,.10)
            20%,

            rgba(0,0,0,.02)
            48%,

            rgba(0,0,0,.18)
            65%,

            rgba(0,0,0,.90)
            100%
        );
}

/* =====================================================
   HEADER
===================================================== */

.header{
    position:absolute;

    top:0;
    right:0;
    left:0;

    z-index:25;

    padding:
        calc(
            env(safe-area-inset-top)
            + 11px
        )
        14px
        8px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    pointer-events:none;
}

.brand{
    display:flex;

    align-items:center;

    gap:9px;

    color:white;

    font-size:18px;

    font-weight:900;

    pointer-events:auto;
}

.brandMark{
    width:38px;
    height:38px;

    border-radius:13px;

    display:grid;

    place-items:center;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);
}

.headerActions{
    display:flex;

    align-items:center;

    gap:7px;

    pointer-events:auto;
}

.iconBtn{
    width:41px;
    height:41px;

    border:
        1px solid
        var(--border);

    border-radius:13px;

    display:grid;

    place-items:center;

    color:white;

    background:
        var(--glass);

    backdrop-filter:
        blur(13px);

    -webkit-backdrop-filter:
        blur(13px);
}

.iconBtn svg{
    width:20px;
    height:20px;

    stroke:
        currentColor;

    fill:none;

    stroke-width:1.9;

    stroke-linecap:round;

    stroke-linejoin:round;
}

/* =====================================================
   CATEGORIES
===================================================== */

.categories{
    position:absolute;

    z-index:24;

    top:
        calc(
            env(safe-area-inset-top)
            + 62px
        );

    right:0;
    left:0;

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        7px
        14px
        10px;

    overflow-x:auto;

    scrollbar-width:none;

    pointer-events:auto;

    touch-action:pan-x;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:none;

    border:
        1px solid
        var(--border);

    border-radius:999px;

    padding:
        8px
        14px;

    color:white;

    background:
        rgba(5,17,23,.38);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    font-size:11px;

    white-space:nowrap;
}

.category.active{
    color:#062c3d;

    background:white;

    border-color:white;

    font-weight:bold;
}

/* =====================================================
   CONTENT
===================================================== */

.content{
    position:absolute;

    z-index:18;

    right:16px;

    left:85px;

    bottom:
        calc(
            env(safe-area-inset-bottom)
            + 82px
        );

    color:white;

    text-shadow:
        0 2px 12px
        rgba(0,0,0,.48);
}

.author{
    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:10px;
}

.avatar{
    width:37px;
    height:37px;

    flex:none;

    border-radius:50%;

    display:grid;

    place-items:center;

    color:white;

    font-size:14px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );

    border:
        1px solid
        rgba(255,255,255,.35);
}

.authorName{
    font-size:13px;

    font-weight:bold;
}

.type{
    margin-top:3px;

    color:#cfeaf4;

    font-size:9px;
}

.title{
    margin-bottom:5px;

    font-size:16px;

    font-weight:800;

    line-height:1.6;
}

.description{
    color:#edf5f7;

    font-size:11px;

    line-height:1.7;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.sourceButton{
    margin-top:9px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:10px;

    padding:
        8px
        10px;

    display:inline-flex;

    align-items:center;

    gap:6px;

    color:white;

    background:
        rgba(7,22,29,.48);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    font-size:10px;
}

.sourceButton svg{
    width:14px;
    height:14px;

    fill:none;

    stroke:
        currentColor;

    stroke-width:2;

    stroke-linecap:round;

    stroke-linejoin:round;
}

/* =====================================================
   ACTIONS
===================================================== */

.actions{
    position:absolute;

    z-index:20;

    left:12px;

    bottom:
        calc(
            env(safe-area-inset-bottom)
            + 85px
        );

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:14px;
}

.action{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:4px;

    color:white;

    font-size:8px;
}

.actionButton{
    width:46px;
    height:46px;

    border:
        1px solid
        rgba(255,255,255,.17);

    border-radius:50%;

    display:grid;

    place-items:center;

    color:white;

    background:
        rgba(5,17,23,.48);

    backdrop-filter:
        blur(13px);

    -webkit-backdrop-filter:
        blur(13px);

    transition:
        transform .12s,
        background .15s,
        color .15s;
}

.actionButton:active{
    transform:
        scale(.87);
}

.actionButton svg{
    width:21px;
    height:21px;

    stroke:
        currentColor;

    fill:none;

    stroke-width:1.9;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.action.active
.actionButton{
    color:
        var(--primary-dark);

    background:white;
}

/* =====================================================
   PLAY STATE
===================================================== */

.playState{
    position:absolute;

    z-index:30;

    top:50%;
    left:50%;

    width:70px;
    height:70px;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(.85);

    border-radius:50%;

    display:grid;

    place-items:center;

    color:white;

    background:
        rgba(0,0,0,.45);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    opacity:0;

    pointer-events:none;

    transition:.18s;
}

.playState.show{
    opacity:1;

    transform:
        translate(
            -50%,
            -50%
        )
        scale(1);
}

.playState svg{
    width:29px;
    height:29px;

    stroke:white;

    fill:white;
}

/* =====================================================
   PROGRESS
===================================================== */

.videoProgress{
    position:absolute;

    z-index:27;

    right:0;
    left:0;

    bottom:
        calc(
            64px
            + env(safe-area-inset-bottom)
        );

    height:2px;

    background:
        rgba(255,255,255,.18);

    pointer-events:none;
}

.videoProgressFill{
    width:0;
    height:100%;

    background:white;

    transition:
        width .1s linear;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottomNav{
    position:absolute;

    z-index:26;

    right:0;
    left:0;
    bottom:0;

    height:
        calc(
            64px
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    align-items:center;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.86)
        );

    pointer-events:auto;
}

.navItem{
    border:0;

    background:transparent;

    color:#cbd8dc;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    font-size:8px;

    text-decoration:none;
}

.navItem svg{
    width:20px;
    height:20px;

    stroke:
        currentColor;

    fill:none;

    stroke-width:1.8;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.navItem.active{
    color:white;

    font-weight:bold;
}

/* =====================================================
   EMPTY
===================================================== */

.emptyPage{
    width:100%;
    height:100%;

    display:grid;

    place-items:center;

    padding:30px;

    text-align:center;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #103c4e,
            #061117 65%
        );
}

.emptyIcon{
    width:75px;
    height:75px;

    margin:
        0 auto
        18px;

    border-radius:24px;

    display:grid;

    place-items:center;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.1);
}

.emptyIcon svg{
    width:33px;
    height:33px;

    stroke:white;

    fill:none;

    stroke-width:1.7;
}

.emptyPage h2{
    margin-bottom:8px;

    font-size:21px;
}

.emptyPage p{
    max-width:330px;

    color:#bfd1d8;

    font-size:11px;

    line-height:1.8;
}

/* =====================================================
   SOURCE MODAL
===================================================== */

.modal{
    position:fixed;

    z-index:1000;

    inset:0;

    display:none;

    align-items:flex-end;

    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:
        blur(5px);

    -webkit-backdrop-filter:
        blur(5px);
}

.modal.show{
    display:flex;
}

.modalCard{
    width:
        min(480px,100%);

    padding:20px;

    border-radius:23px;

    color:#17313d;

    background:white;

    animation:
        modalUp .22s ease;
}

@keyframes modalUp{

    from{
        transform:
            translateY(30px);

        opacity:0;
    }

    to{
        transform:
            translateY(0);

        opacity:1;
    }

}

.modalHandle{
    width:45px;
    height:4px;

    margin:
        0 auto
        17px;

    border-radius:999px;

    background:#d8e2e6;
}

.modalCard h3{
    margin-bottom:7px;

    font-size:18px;
}

.modalCard p{
    color:#70838c;

    font-size:11px;

    line-height:1.8;
}

.modalButtons{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin-top:17px;
}

.modalButton{
    border:
        1px solid
        #dce9ee;

    border-radius:12px;

    padding:11px;

    color:#17313d;

    background:#f8fbfc;
}

.modalPrimary{
    color:white;

    border-color:
        var(--primary-dark);

    background:
        var(--primary-dark);
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    z-index:2000;

    top:
        calc(
            env(safe-area-inset-top)
            + 72px
        );

    left:50%;

    max-width:
        calc(100% - 30px);

    transform:
        translate(
            -50%,
            -15px
        );

    padding:
        10px
        15px;

    border-radius:999px;

    color:#073247;

    background:white;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.23);

    font-size:10px;

    font-weight:bold;

    white-space:nowrap;

    opacity:0;

    pointer-events:none;

    transition:.22s;
}

.toast.show{
    opacity:1;

    transform:
        translate(
            -50%,
            0
        );
}

/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-height:680px){

    .header{
        padding-top:
            calc(
                env(safe-area-inset-top)
                + 7px
            );
    }

    .brandMark{
        width:34px;
        height:34px;
    }

    .categories{
        top:
            calc(
                env(safe-area-inset-top)
                + 52px
            );
    }

    .content{
        bottom:
            calc(
                env(safe-area-inset-bottom)
                + 70px
            );
    }

    .actions{
        bottom:
            calc(
                env(safe-area-inset-bottom)
                + 72px
            );

        gap:9px;
    }

    .actionButton{
        width:41px;
        height:41px;
    }

    .description{
        -webkit-line-clamp:1;
    }

}

/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    body{
        background:#07141a;
    }

    .app{
        width:500px;

        max-width:100%;

        margin:auto;

        box-shadow:
            0 0 80px
            rgba(0,0,0,.8);
    }

}
</style>

/* =====================================================
   GET VIDEOS FROM ADMIN
===================================================== */

function getAllVideos(){

    let adminVideos = [];

    try{

        adminVideos =
            JSON.parse(
                localStorage.getItem(
                    "zaadVideos"
                ) || "[]"
            );

    }
    catch(error){

        adminVideos = [];

    }


    /*
       إذا أضفت مقاطع من admin.html
       نستخدمها بدل المقاطع التجريبية.
    */

    if(
        Array.isArray(adminVideos) &&
        adminVideos.length
    ){

        return adminVideos.filter(
            item =>
                item.status ===
                "published"
        );

    }


    return DEMO_VIDEOS;

}

/* =====================================================
   RENDER
===================================================== */

function render(){

    const allVideos =
        getAllVideos();


    if(
        currentCategory ===
        "all"
    ){

        visibleVideos =
            allVideos;

    }
    else{

        visibleVideos =
            allVideos.filter(
                item =>
                    item.category ===
                    currentCategory
            );

    }


    const feed =
        document.getElementById(
            "feed"
        );


    if(
        !visibleVideos.length
    ){

        feed.innerHTML = `

        <div class="emptyPage">

            <div>

                <div class="emptyIcon">

                    ${ICONS.video}

                </div>

                <h2>
                    لا توجد مقاطع
                </h2>

                <p>

                    لا توجد مقاطع منشورة
                    في هذا القسم حاليًا.

                </p>

            </div>

        </div>

        `;

        return;

    }


    feed.innerHTML =
        visibleVideos
            .map(
                (
                    item,
                    index
                ) =>
                    videoCard(
                        item,
                        index
                    )
            )
            .join("");


    currentIndex =
        0;


    initShortNavigation();

    bindVideoEvents();

}


/* =====================================================
   INITIAL POSITIONS
===================================================== */

function initShortNavigation(){

    const cards =
        getCards();


    cards.forEach(
        (
            card,
            index
        )=>{

            card.classList.remove(
                "current",
                "previous",
                "next"
            );


            card.style.transition =
                "";

            card.style.transform =
                "";


            if(
                index <
                currentIndex
            ){

                card.classList.add(
                    "previous"
                );

            }
            else if(
                index ===
                currentIndex
            ){

                card.classList.add(
                    "current"
                );

            }
            else{

                card.classList.add(
                    "next"
                );

            }

        }
    );


    requestAnimationFrame(
        ()=>{
            playCurrentVideo();
        }
    );

}


/* =====================================================
   GET CARDS
===================================================== */

function getCards(){

    return [
        ...document
            .querySelectorAll(
                ".short"
            )
    ];

}


/* =====================================================
   UPDATE CARDS
===================================================== */

function updateCards(){

    const cards =
        getCards();


    cards.forEach(
        (
            card,
            index
        )=>{

            card.classList.remove(
                "current",
                "previous",
                "next"
            );


            card.style.transition =
                "";

            card.style.transform =
                "";


            if(
                index <
                currentIndex
            ){

                card.classList.add(
                    "previous"
                );

            }
            else if(
                index ===
                currentIndex
            ){

                card.classList.add(
                    "current"
                );

            }
            else{

                card.classList.add(
                    "next"
                );

            }

        }
    );


    playCurrentVideo();

}


/* =====================================================
   VIDEO EVENTS
===================================================== */

function bindVideoEvents(){

    document
        .querySelectorAll(
            ".short video"
        )
        .forEach(video=>{

            video.addEventListener(
                "click",
                ()=>{

                    const card =
                        video.closest(
                            ".short"
                        );


                    if(
                        !card.classList
                            .contains(
                                "current"
                            )
                    ){
                        return;
                    }


                    if(video.paused){

                        pauseAll(
                            video
                        );

                        video.play()
                            .catch(()=>{});

                        showPlayState(
                            card,
                            "play"
                        );

                    }
                    else{

                        video.pause();

                        showPlayState(
                            card,
                            "pause"
                        );

                    }

                }
            );


            video.addEventListener(
                "timeupdate",
                ()=>{

                    const card =
                        video.closest(
                            ".short"
                        );


                    const fill =
                        card.querySelector(
                            ".videoProgressFill"
                        );


                    if(
                        !video.duration ||
                        !fill
                    ){
                        return;
                    }


                    const progress =
                        (
                            video.currentTime /
                            video.duration
                        )
                        *100;


                    fill.style.width =
                        progress+"%";

                }
            );

        });

}


/* =====================================================
   PLAY STATE
===================================================== */

function showPlayState(
    card,
    state
){

    const element =
        card.querySelector(
            ".playState"
        );


    element.innerHTML =
        state === "pause"
        ?
        ICONS.pause
        :
        ICONS.play;


    element.classList.add(
        "show"
    );


    setTimeout(
        ()=>{

            element.classList.remove(
                "show"
            );

        },
        450
    );

}


/* =====================================================
   PLAY CURRENT VIDEO
===================================================== */

function playCurrentVideo(){

    const cards =
        getCards();


    cards.forEach(
        (
            card,
            index
        )=>{

            const video =
                card.querySelector(
                    "video"
                );


            if(!video){
                return;
            }


            if(
                index ===
                currentIndex
            ){

                /*
                   نحاول التشغيل بالصوت أولاً.
                   بعض المتصفحات ستمنعه.
                   عندها نجرب muted.
                */

                const promise =
                    video.play();


                if(
                    promise &&
                    typeof promise.catch ===
                    "function"
                ){

                    promise.catch(
                        ()=>{

                            video.muted =
                                true;

                            updateSoundButton(
                                card,
                                true
                            );

                            video.play()
                                .catch(()=>{});

                        }
                    );

                }

            }
            else{

                video.pause();

            }

        }
    );

}


/* =====================================================
   PAUSE ALL
===================================================== */

function pauseAll(
    except=null
){

    document
        .querySelectorAll(
            ".short video"
        )
        .forEach(video=>{

            if(
                video !==
                except
            ){

                video.pause();

            }

        });

}


/* =====================================================
   NEXT
===================================================== */

let moving =
    false;


const TRANSITION_TIME =
    320;


function nextVideo(){

    const cards =
        getCards();


    if(moving){
        return;
    }


    if(
        currentIndex >=
        cards.length - 1
    ){

        bounceEdge(-1);

        return;
    }


    moving =
        true;


    currentIndex++;


    updateCards();


    setTimeout(
        ()=>{

            moving =
                false;

        },
        TRANSITION_TIME
    );

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousVideo(){

    if(moving){
        return;
    }


    if(
        currentIndex <= 0
    ){

        bounceEdge(1);

        return;
    }


    moving =
        true;


    currentIndex--;


    updateCards();


    setTimeout(
        ()=>{

            moving =
                false;

        },
        TRANSITION_TIME
    );

}


/* =====================================================
   EDGE BOUNCE
===================================================== */

function bounceEdge(
    direction
){

    const cards =
        getCards();


    const card =
        cards[currentIndex];


    if(!card){
        return;
    }


    card.style.transition =
        "transform 130ms ease";


    card.style.transform =
        `translate3d(
            0,
            ${direction * 17}px,
            0
        )`;


    setTimeout(
        ()=>{

            card.style.transform =
                "translate3d(0,0,0)";


            setTimeout(
                ()=>{

                    card.style.transition =
                        "";

                    card.style.transform =
                        "";

                },
                140
            );

        },
        130
    );

}


/* =====================================================
   TOUCH NAVIGATION
===================================================== */

let startY =
    0;

let currentY =
    0;

let startTime =
    0;

let dragging =
    false;


/* TOUCH START */

function touchStart(event){

    if(moving){
        return;
    }


    /*
       لا نبدأ سحب الفيديو
       إذا المستخدم يتعامل مع زر
       أو التصنيفات.
    */

    if(
        event.target.closest(
            "button,a,.categories"
        )
    ){

        return;

    }


    if(
        event.touches.length !==
        1
    ){

        return;

    }


    startY =
        event.touches[0]
            .clientY;


    currentY =
        startY;


    startTime =
        performance.now();


    dragging =
        true;

}


/* TOUCH MOVE */

function touchMove(event){

    if(!dragging){
        return;
    }


    if(
        event.touches.length !==
        1
    ){

        return;
    }


    currentY =
        event.touches[0]
            .clientY;


    let delta =
        currentY -
        startY;


    const cards =
        getCards();


    /*
       مقاومة عند البداية والنهاية
    */

    if(
        currentIndex === 0 &&
        delta > 0
    ){

        delta *=
            .20;

    }


    if(
        currentIndex ===
        cards.length - 1 &&
        delta < 0
    ){

        delta *=
            .20;

    }


    const height =
        getScreenHeight();


    delta =
        Math.max(
            -height,
            Math.min(
                height,
                delta
            )
        );


    moveCardsWithFinger(
        delta
    );


    event.preventDefault();

}


/* TOUCH END */

function touchEnd(){

    if(!dragging){
        return;
    }


    dragging =
        false;


    const delta =
        currentY -
        startY;


    const elapsed =
        Math.max(
            1,
            performance.now()
            -
            startTime
        );


    const velocity =
        Math.abs(delta)
        /
        elapsed;


    /*
       السحب الطبيعي
    */

    const distanceThreshold =
        Math.min(
            75,
            getScreenHeight()
            * .10
        );


    /*
       Flick سريع مثل تطبيقات الشورتز
    */

    const fastSwipe =
        velocity > .42 &&
        Math.abs(delta) > 25;


    clearInlineTransforms();


    if(
        delta <
        -distanceThreshold ||
        (
            delta < 0 &&
            fastSwipe
        )
    ){

        nextVideo();

    }
    else if(
        delta >
        distanceThreshold ||
        (
            delta > 0 &&
            fastSwipe
        )
    ){

        previousVideo();

    }
    else{

        updateCards();

    }

}


/* =====================================================
   MOVE CARDS WITH FINGER
===================================================== */

function moveCardsWithFinger(
    delta
){

    const cards =
        getCards();


    const current =
        cards[
            currentIndex
        ];


    const previous =
        cards[
            currentIndex - 1
        ];


    const next =
        cards[
            currentIndex + 1
        ];


    const height =
        getScreenHeight();


    if(current){

        current.style.transition =
            "none";


        current.style.transform =
            `translate3d(
                0,
                ${delta}px,
                0
            )`;

    }


    if(
        delta < 0 &&
        next
    ){

        next.style.transition =
            "none";


        next.style.transform =
            `translate3d(
                0,
                ${height + delta}px,
                0
            )`;

    }


    if(
        delta > 0 &&
        previous
    ){

        previous.style.transition =
            "none";


        previous.style.transform =
            `translate3d(
                0,
                ${-height + delta}px,
                0
            )`;

    }

}


/* =====================================================
   CLEAR DRAG
===================================================== */

function clearInlineTransforms(){

    getCards()
        .forEach(card=>{

            card.style.transition =
                "";

            card.style.transform =
                "";

        });

}


/* =====================================================
   SCREEN HEIGHT
===================================================== */

function getScreenHeight(){

    if(
        window.visualViewport
    ){

        return window
            .visualViewport
            .height;

    }


    return window.innerHeight;

}


/* =====================================================
   WHEEL
===================================================== */

let wheelLocked =
    false;

let wheelAccumulator =
    0;

let wheelTimer;


function wheelNavigation(
    event
){

    event.preventDefault();


    if(wheelLocked){
        return;
    }


    wheelAccumulator +=
        event.deltaY;


    clearTimeout(
        wheelTimer
    );


    wheelTimer =
        setTimeout(
            ()=>{

                wheelAccumulator =
                    0;

            },
            180
        );


    if(
        Math.abs(
            wheelAccumulator
        ) < 45
    ){

        return;

    }


    wheelLocked =
        true;


    if(
        wheelAccumulator > 0
    ){

        nextVideo();

    }
    else{

        previousVideo();

    }


    wheelAccumulator =
        0;


    setTimeout(
        ()=>{

            wheelLocked =
                false;

        },
        400
    );

}


/* =====================================================
   KEYBOARD
===================================================== */

function keyboardNavigation(
    event
){

    if(
        event.key ===
        "ArrowDown" ||
        event.key ===
        "PageDown"
    ){

        event.preventDefault();

        nextVideo();

    }


    if(
        event.key ===
        "ArrowUp" ||
        event.key ===
        "PageUp"
    ){

        event.preventDefault();

        previousVideo();

    }


    if(
        event.key ===
        " "
    ){

        event.preventDefault();

        toggleCurrentPlayback();

    }

}


/* =====================================================
   PLAY CURRENT
===================================================== */

function toggleCurrentPlayback(){

    const cards =
        getCards();


    const card =
        cards[currentIndex];


    if(!card){
        return;
    }


    const video =
        card.querySelector(
            "video"
        );


    if(!video){
        return;
    }


    if(video.paused){

        video.play()
            .catch(()=>{});

        showPlayState(
            card,
            "play"
        );

    }
    else{

        video.pause();

        showPlayState(
            card,
            "pause"
        );

    }

}


/* =====================================================
   CATEGORY
===================================================== */

function changeCategory(
    category
){

    pauseAll();


    currentCategory =
        category;


    currentIndex =
        0;


    render();

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(id){

    id =
        Number(id);


    if(
        liked.includes(id)
    ){

        liked =
            liked.filter(
                value =>
                    value !== id
            );

    }
    else{

        liked.push(id);

    }


    localStorage.setItem(
        "zaadLikes",
        JSON.stringify(
            liked
        )
    );


    const element =
        document.getElementById(
            "like-"+id
        );


    if(element){

        element.classList.toggle(
            "active",
            liked.includes(id)
        );

    }

}


/* =====================================================
   SAVE
===================================================== */

function toggleSave(id){

    id =
        Number(id);


    if(
        saved.includes(id)
    ){

        saved =
            saved.filter(
                value =>
                    value !== id
            );

    }
    else{

        saved.push(id);


        addPoints(
            2,
            "+2 نقطة نشاط"
        );

    }


    localStorage.setItem(
        "zaadSaved",
        JSON.stringify(
            saved
        )
    );


    const element =
        document.getElementById(
            "save-"+id
        );


    if(element){

        element.classList.toggle(
            "active",
            saved.includes(id)
        );

    }

}


/* =====================================================
   POINTS
===================================================== */

function addPoints(
    amount,
    message
){

    points +=
        amount;


    localStorage.setItem(
        "zaadPoints",
        points
    );


    showToast(
        message
    );

}


/* =====================================================
   SHARE
===================================================== */

async function shareVideo(id){

    const item =
        getAllVideos()
            .find(
                video =>
                    Number(video.id) ===
                    Number(id)
            );


    if(!item){
        return;
    }


    const text =
        item.title +
        (
            item.description
            ?
            "\n\n" +
            item.description
            :
            ""
        ) +
        (
            item.source
            ?
            "\n\nالمصدر: " +
            item.source
            :
            ""
        );


    if(navigator.share){

        try{

            await navigator.share({
                title:
                    item.title,

                text:
                    text
            });

        }
        catch(error){}

    }
    else{

        try{

            await navigator
                .clipboard
                .writeText(
                    text
                );


            showToast(
                "تم نسخ معلومات المقطع"
            );

        }
        catch(error){

            showToast(
                "تعذرت المشاركة"
            );

        }

    }

}


/* =====================================================
   SOUND
===================================================== */

function toggleMute(
    button
){

    const card =
        button.closest(
            ".short"
        );


    const video =
        card.querySelector(
            "video"
        );


    video.muted =
        !video.muted;


    updateSoundButton(
        card,
        video.muted
    );


    showToast(
        video.muted
        ?
        "تم كتم الصوت"
        :
        "تم تشغيل الصوت"
    );

}


function updateSoundButton(
    card,
    muted
){

    const button =
        card.querySelector(
            "[data-sound-button]"
        );


    if(!button){
        return;
    }


    button.innerHTML =
        muted
        ?
        ICONS.mute
        :
        ICONS.volume;

}


/* =====================================================
   SOURCE
===================================================== */

function showSource(id){

    const item =
        getAllVideos()
            .find(
                video =>
                    Number(video.id) ===
                    Number(id)
            );


    if(!item){
        return;
    }


    const text =
        item.source ||
        "لم يتم إضافة مصدر لهذا المقطع.";


    currentSourceURL =
        item.sourceURL ||
        "";


    document
        .getElementById(
            "sourceText"
        )
        .textContent =
        text;


    const openButton =
        document
            .getElementById(
                "openSourceButton"
            );


    openButton.style.display =
        currentSourceURL
        ?
        "block"
        :
        "none";


    document
        .getElementById(
            "sourceModal"
        )
        .classList.add(
            "show"
        );


    pauseAll();

}


/* =====================================================
   OPEN SOURCE
===================================================== */

function openSourceURL(){

    if(!currentSourceURL){
        return;
    }


    try{

        const url =
            new URL(
                currentSourceURL
            );


        if(
            url.protocol !== "https:" &&
            url.protocol !== "http:"
        ){

            showToast(
                "رابط المصدر غير صالح"
            );

            return;

        }


        window.open(
            url.href,
            "_blank",
            "noopener,noreferrer"
        );

    }
    catch(error){

        showToast(
            "رابط المصدر غير صالح"
        );

    }

}


/* =====================================================
   CLOSE SOURCE
===================================================== */

function closeSource(){

    document
        .getElementById(
            "sourceModal"
        )
        .classList.remove(
            "show"
        );


    playCurrentVideo();

}


function closeSourceByBackground(
    event
){

    if(
        event.target.id ===
        "sourceModal"
    ){

        closeSource();

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
    message
){

    const toast =
        document
            .getElementById(
                "toast"
            );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            1700
        );

}


/* =====================================================
   STORAGE HELPER
===================================================== */

function readArray(key){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    key
                ) || "[]"
            );


        return Array.isArray(data)
            ?
            data.map(Number)
            :
            [];

    }
    catch(error){

        return [];

    }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value);


    return div.innerHTML;

}


function safeAttribute(value){

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#39;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =====================================================
   TOUCH EVENTS
===================================================== */

const feed =
    document.getElementById(
        "feed"
    );


feed.addEventListener(
    "touchstart",
    touchStart,
    {
        passive:true
    }
);


feed.addEventListener(
    "touchmove",
    touchMove,
    {
        passive:false
    }
);


feed.addEventListener(
    "touchend",
    touchEnd,
    {
        passive:true
    }
);


feed.addEventListener(
    "touchcancel",
    touchEnd,
    {
        passive:true
    }
);


/* =====================================================
   MOUSE WHEEL
===================================================== */

feed.addEventListener(
    "wheel",
    wheelNavigation,
    {
        passive:false
    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    keyboardNavigation
);


/* =====================================================
   PREVENT ZOOM
===================================================== */

document.addEventListener(
    "gesturestart",
    event=>{

        event.preventDefault();

    }
);


document.addEventListener(
    "gesturechange",
    event=>{

        event.preventDefault();

    }
);


document.addEventListener(
    "gestureend",
    event=>{

        event.preventDefault();

    }
);


/* =====================================================
   DOUBLE TAP ZOOM
===================================================== */

let lastTouchEnd =
    0;


document.addEventListener(
    "touchend",
    event=>{

        const now =
            Date.now();


        if(
            now -
            lastTouchEnd <
            280
        ){

            /*
               لا نمنع touchend الخاص
               بالتنقل، فقط zoom المتكرر.
            */

        }


        lastTouchEnd =
            now;

    },
    {
        passive:true
    }
);


/* =====================================================
   RESIZE

   يمنع الهبوط عند تغير ارتفاع
   شريط المتصفح في الجوال.
===================================================== */

let resizeTimer;


function handleResize(){

    clearTimeout(
        resizeTimer
    );


    resizeTimer =
        setTimeout(
            ()=>{

                if(!dragging){

                    clearInlineTransforms();

                    updateCards();

                }

            },
            100
        );

}


window.addEventListener(
    "resize",
    handleResize
);


if(
    window.visualViewport
){

    window.visualViewport
        .addEventListener(
            "resize",
            handleResize
        );

}


/* =====================================================
   VISIBILITY

   إذا خرج المستخدم من الصفحة
   نوقف الفيديو.
===================================================== */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.hidden
        ){

            pauseAll();

        }
        else{

            playCurrentVideo();

        }

    }
);


/* =====================================================
   START
===================================================== */

render();

</script>
