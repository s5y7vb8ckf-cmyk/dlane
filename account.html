<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7fcff">
<link rel="manifest" href="manifest.json">
<title>حسابي | زاد</title>

<style>
:root{
  --bg:#f4f9fc;--surface:#fff;--surface2:#f7fbfd;--text:#102f3b;--muted:#738994;
  --line:#dceaf0;--primary:#0b86b5;--primary2:#27b9e9;--shadow:0 18px 55px rgba(22,70,88,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:
 radial-gradient(circle at 50% -180px,#dff6ff 0,transparent 430px),var(--bg);color:var(--text)}
button,input{font:inherit}
button,a,label{touch-action:manipulation}
.app{width:min(100%,820px);margin:auto;min-height:100vh;padding:18px 18px 100px}
.top{height:58px;display:flex;align-items:center;justify-content:space-between}
.brandWrap{display:flex;align-items:center;gap:10px}
.brandMark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:900;box-shadow:0 9px 25px rgba(11,134,181,.18)}
.brand{font-weight:900;font-size:20px;letter-spacing:-.4px}
.brandSmall{font-size:9px;color:var(--muted);margin-top:2px}
.back{width:43px;height:43px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.9);display:grid;place-items:center;text-decoration:none;color:var(--primary);font-size:25px;box-shadow:0 8px 22px rgba(23,72,90,.05)}
.profile{position:relative;margin-top:14px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;padding:27px 22px 20px;text-align:center;box-shadow:var(--shadow);overflow:hidden}
.profile:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--primary),var(--primary2))}
.avatarWrap{position:relative;width:100px;margin:auto}
.avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#075f82,var(--primary2));color:#fff;display:grid;place-items:center;font-size:36px;font-weight:900;overflow:hidden;border:5px solid #edfaff;box-shadow:0 12px 30px rgba(9,118,158,.18)}
.avatar img{width:100%;height:100%;object-fit:cover}
.cameraBadge{position:absolute;bottom:2px;left:1px;width:31px;height:31px;border:3px solid #fff;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;cursor:pointer}
.cameraBadge svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.pickText{margin-top:10px;color:var(--primary);font-size:10px;font-weight:900;cursor:pointer;display:inline-block}
.nameRow{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px}
.name{font-size:21px;font-weight:900;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editName{width:31px;height:31px;border:1px solid #dcecf2;border-radius:10px;background:#f2fafe;color:var(--primary);display:grid;place-items:center;cursor:pointer}
.editName svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.sub{font-size:10px;color:var(--muted);margin:6px auto 0;line-height:1.7;max-width:430px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:21px}
.stat{position:relative;background:var(--surface2);border:1px solid #e7f1f5;border-radius:17px;padding:14px 7px}
.stat b{display:block;font-size:19px;color:var(--primary);font-weight:900}
.stat span{display:block;margin-top:3px;font-size:9px;color:var(--muted)}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}
.sectionHead h2{font-size:14px;margin:0}
.sectionHead span{font-size:9px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:39px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 14px;white-space:nowrap;color:#536d77;font-size:10px;font-weight:700;cursor:pointer;transition:.2s}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 8px 20px rgba(11,134,181,.15)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:7px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 10px 28px rgba(20,67,84,.045);transition:.2s}
.thumb{height:150px;background:linear-gradient(145deg,#0a3344,#087da9);display:grid;place-items:center;color:#fff;position:relative}
.thumb:after{content:"";position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(5px)}
.thumb svg{width:25px;position:relative;z-index:1}
.ct{padding:12px}.ct b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct span{display:block;margin-top:5px;font-size:8px;color:#81949b}
.empty{grid-column:1/-1;padding:48px 15px;text-align:center;color:#8298a1;background:#fff;border-radius:20px;border:1px dashed #cfe3eb}
.emptyIcon{width:48px;height:48px;margin:0 auto 10px;border-radius:15px;background:#edf9fd;display:grid;place-items:center;color:var(--primary);font-size:21px}
.bottom{position:fixed;z-index:1000;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);border-top:1px solid #e0ebf0;display:flex;justify-content:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.bottomin{height:69px;width:min(820px,100%);display:grid;grid-template-columns:repeat(3,1fr)}
.nav{position:relative;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;text-decoration:none;color:#78909a;font-size:9px;font-weight:700}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.nav.active{color:var(--primary);font-weight:900}
.nav.active:before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 5px 5px;background:var(--primary)}
.nameModal{position:fixed;z-index:5000;inset:0;background:rgba(5,25,34,.55);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(7px)}
.nameModal.show{display:flex}
.nameCard{width:min(100%,410px);background:#fff;border:1px solid var(--line);border-radius:25px;padding:21px;box-shadow:0 30px 80px rgba(0,0,0,.22)}
.nameCard h3{margin:0 0 6px;font-size:17px}.nameCard p{margin:0 0 15px;color:var(--muted);font-size:10px;line-height:1.8}
.nameInput{width:100%;height:50px;border:1px solid #d6e7ee;border-radius:14px;background:#f8fcfe;padding:0 14px;outline:0;color:var(--text);font-size:16px}
.nameInput:focus{border-color:var(--primary2);box-shadow:0 0 0 4px rgba(39,185,233,.10)}
.nameError{min-height:21px;padding-top:6px;color:#b34a4a;font-size:9px}
.nameButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.nameButtons button{height:45px;border-radius:13px;font-weight:900;cursor:pointer}
.saveName{border:0;background:var(--primary);color:#fff}.cancelName{border:1px solid var(--line);background:#fff;color:#607984}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 15px 35px rgba(20,67,84,.08)}.back:hover,.editName:hover{border-color:#b8dce9}}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.profile{padding:30px 32px 23px}}
@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.profile{padding-left:13px;padding-right:13px}.stat b{font-size:17px}.stat span{font-size:8px}}
</style>

</head>
<body>

<main class="app">
  <div class="top">
    <div class="brandWrap">
      <div class="brandMark">ز</div>
      <div><div class="brand">حسابي</div><div class="brandSmall">زاد • رفيق المسلم اليومي</div></div>
    </div>
    <a class="back" href="shorts.html" aria-label="العودة">‹</a>
  </div>

  <section class="profile">
    <div class="avatarWrap">
      <div class="avatar" id="avatar">ز</div>
      <label class="cameraBadge" aria-label="تغيير صورة الحساب">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3"/></svg>
        <input id="photo" type="file" accept="image/*" hidden>
      </label>
    </div>
    <label class="pickText" for="photo">تغيير صورة الحساب</label>

    <div class="nameRow">
      <div class="name" id="profileName">حساب زاد</div>
      <button class="editName" id="editName" type="button" aria-label="تعديل الاسم">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
      </button>
    </div>

    <div class="sub">الاسم والصورة محفوظان على هذا الجهاز ويُستخدم الاسم عند كتابة التعليقات</div>

    <div class="stats">
      <div class="stat"><b id="points">0</b><span>نقاط النشاط</span></div>
      <div class="stat"><b id="savedCount">0</b><span>المحفوظة</span></div>
      <div class="stat"><b id="offlineCount">0</b><span>بدون شبكة</span></div>
    </div>
  </section>

  <div class="sectionHead"><h2>مكتبتي</h2><span>المحتوى المرتبط بحسابك</span></div>
  <div class="tabs">
    <button class="tab active" data-tab="saved">المقاطع المفضلة</button>
    <button class="tab" data-tab="liked">الإعجابات</button>
    <button class="tab" data-tab="offline">بدون شبكة</button>
  </div>

  <section class="grid" id="grid"></section>
</main>

<nav class="bottom">
  <div class="bottomin">
    <a class="nav" href="index.html"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg><span>الرئيسية</span></a>
    <a class="nav" href="shorts.html"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg><span>المقاطع</span></a>
    <a class="nav active" href="account.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>حسابي</span></a>
  </div>
</nav>

<div class="nameModal" id="nameModal">
  <form class="nameCard" id="nameForm">
    <h3>اسم الحساب</h3>
    <p>هذا الاسم سيظهر في حسابك ويُستخدم تلقائيًا عند إضافة تعليق على المقاطع.</p>
    <input class="nameInput" id="nameInput" maxlength="30" autocomplete="name" placeholder="اكتب اسمك">
    <div class="nameError" id="nameError"></div>
    <div class="nameButtons">
      <button class="saveName" type="submit">حفظ الاسم</button>
      <button class="cancelName" id="cancelName" type="button">إلغاء</button>
    </div>
  </form>
</div>

<script>
const $=s=>document.querySelector(s);

const catalog=(()=>{
  try{return JSON.parse(localStorage.getItem('zaadVideoCatalog')||'[]')}
  catch(e){return[]}
})();

const ids=k=>{
  try{return JSON.parse(localStorage.getItem(k)||'[]')}
  catch(e){return[]}
};

$('#points').textContent=localStorage.getItem('zaadPoints')||0;
$('#savedCount').textContent=ids('zaadSaved').length;

/* الاسم: نفس المفتاح الذي تقرؤه صفحة المقاطع */
function getProfile(){
  try{
    const p=JSON.parse(localStorage.getItem('zaadAccountProfile')||'{}');
    return p&&typeof p==='object'?p:{};
  }catch(e){return{}}
}

function loadName(){
  const p=getProfile();
  const name=String(p.name||'').trim();
  $('#profileName').textContent=name||'حساب زاد';
}

function openNameEditor(){
  const p=getProfile();
  $('#nameInput').value=String(p.name||'');
  $('#nameError').textContent='';
  $('#nameModal').classList.add('show');
  setTimeout(()=>$('#nameInput').focus(),80);
}

function closeNameEditor(){
  $('#nameModal').classList.remove('show');
}

$('#editName').onclick=openNameEditor;
$('#cancelName').onclick=closeNameEditor;
$('#nameModal').onclick=e=>{if(e.target===$('#nameModal'))closeNameEditor()};

$('#nameForm').onsubmit=e=>{
  e.preventDefault();
  const name=$('#nameInput').value.trim().replace(/\s+/g,' ');

  if(name.length<2){
    $('#nameError').textContent='اكتب اسمًا من حرفين على الأقل.';
    return;
  }

  const p=getProfile();
  p.name=name;
  localStorage.setItem('zaadAccountProfile',JSON.stringify(p));

  // توافق إضافي مع أي نسخة قديمة من صفحة المقاطع
  localStorage.setItem('zaadAccountName',name);

  loadName();
  closeNameEditor();
};

/* الصورة */
function loadAvatar(){
  const v=localStorage.getItem('zaadProfileAvatar');
  $('#avatar').innerHTML=v?`<img src="${v}" alt="صورة الحساب">`:'ز';
}
loadAvatar();
loadName();

$('#photo').onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;

  if(!f.type.startsWith('image/'))return;

  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const m=320;
      const sc=Math.min(1,m/Math.max(img.width,img.height));
      c.width=Math.max(1,Math.round(img.width*sc));
      c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);

      try{
        localStorage.setItem('zaadProfileAvatar',c.toDataURL('image/jpeg',.78));
        loadAvatar();
      }catch(err){
        alert('تعذر حفظ الصورة. جرّب صورة أصغر.');
      }
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
};

/* المقاطع بدون شبكة */
function openDB(){
  return new Promise((a,b)=>{
    const r=indexedDB.open('zaadOfflineDB',1);
    r.onupgradeneeded=()=>{
      if(!r.result.objectStoreNames.contains('videos'))
        r.result.createObjectStore('videos',{keyPath:'id'});
    };
    r.onsuccess=()=>a(r.result);
    r.onerror=()=>b(r.error);
  });
}

async function offline(){
  try{
    const db=await openDB();
    return await new Promise(r=>{
      const q=db.transaction('videos','readonly').objectStore('videos').getAll();
      q.onsuccess=()=>r(q.result||[]);
      q.onerror=()=>r([]);
    });
  }catch(e){return[]}
}

function esc(v){
  const d=document.createElement('div');
  d.textContent=v||'';
  return d.innerHTML;
}

function cards(list,offlineMode=false){
  $('#grid').innerHTML=list.length
    ?list.map(v=>`
      <a class="card" href="${offlineMode?'offline.html?id='+encodeURIComponent(v.id):'index.html'}">
        <div class="thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="4" y="3" width="16" height="18" rx="4"/>
            <path d="m10 9 5 3-5 3Z"/>
          </svg>
        </div>
        <div class="ct">
          <b>${esc(v.title)}</b>
          <span>${esc(v.publisher||'زاد')}</span>
        </div>
      </a>`).join('')
    :'<div class="empty"><div class="emptyIcon">ز</div><b>لا توجد مقاطع هنا حتى الآن</b><div style="font-size:9px;margin-top:6px">ستظهر المقاطع هنا عند إضافتها إلى هذه القائمة.</div></div>';
}

async function show(tab){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));

  if(tab==='offline'){
    const a=await offline();
    $('#offlineCount').textContent=a.length;
    cards(a,true);
    return;
  }

  const set=new Set(ids(tab==='saved'?'zaadSaved':'zaadLikes'));
  cards(catalog.filter(v=>set.has(v.id)));
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
offline().then(a=>$('#offlineCount').textContent=a.length);
show('saved');

if('serviceWorker'in navigator&&location.protocol!=='file:')
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
</body>
</html>
