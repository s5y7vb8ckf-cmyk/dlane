<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7fcff">
<link rel="manifest" href="manifest.json">
<title>حسابي | زاد</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5fbfe;color:#12313e}
button,input{font:inherit}
.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between}
.back{width:42px;height:42px;border:1px solid #d9edf5;border-radius:14px;background:#fff;display:grid;place-items:center;text-decoration:none;color:#087da9;font-size:25px}
.brand{font-weight:900;font-size:20px}
.profile{margin-top:20px;background:#fff;border:1px solid #dceff6;border-radius:26px;padding:22px;text-align:center;box-shadow:0 12px 35px #0c71910d}
.avatar{width:92px;height:92px;margin:auto;border-radius:50%;background:linear-gradient(135deg,#087da9,#28b6eb);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900;overflow:hidden;border:4px solid #e9f8fd}
.avatar img{width:100%;height:100%;object-fit:cover}
.pick{display:inline-block;margin-top:12px;padding:9px 14px;border-radius:12px;background:#e9f8fd;color:#087da9;font-size:12px;font-weight:bold;cursor:pointer}
.nameRow{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px}
.name{font-size:19px;font-weight:900;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editName{width:32px;height:32px;border:0;border-radius:10px;background:#eef9fd;color:#087da9;display:grid;place-items:center;cursor:pointer}
.editName svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.sub{font-size:11px;color:#78909a;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:#f7fcfe;border-radius:16px;padding:13px}.stat b{display:block;font-size:18px;color:#087da9}.stat span{font-size:9px;color:#78909a}
.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0 12px}
.tab{border:1px solid #d9edf5;background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap;color:#46616b}
.tab.active{background:#087da9;color:#fff;border-color:#087da9}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border:1px solid #deeff5;border-radius:18px;overflow:hidden;text-decoration:none;color:inherit}
.thumb{height:145px;background:linear-gradient(135deg,#092d3c,#087da9);display:grid;place-items:center;color:#fff}.thumb svg{width:34px}
.ct{padding:11px}.ct b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ct span{font-size:9px;color:#81949b}
.empty{grid-column:1/-1;padding:55px 15px;text-align:center;color:#8298a1;background:#fff;border-radius:20px;border:1px dashed #cfe6ef}
.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #e1eef3;display:flex;justify-content:center}
.bottomin{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr)}
.nav{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#6f8790;font-size:11px}.nav.active{color:#087da9;font-weight:bold}

/* نافذة تعديل الاسم */
.nameModal{position:fixed;z-index:5000;inset:0;background:rgba(6,29,39,.48);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(5px)}
.nameModal.show{display:flex}
.nameCard{width:min(100%,410px);background:#fff;border-radius:24px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.2)}
.nameCard h3{margin:0 0 6px;font-size:17px}
.nameCard p{margin:0 0 15px;color:#78909a;font-size:10px;line-height:1.8}
.nameInput{width:100%;height:48px;border:1px solid #d7eaf1;border-radius:14px;background:#f8fcfe;padding:0 14px;outline:0;color:#12313e;font-size:14px}
.nameInput:focus{border-color:#28b6eb;box-shadow:0 0 0 3px #28b6eb18}
.nameError{min-height:20px;padding-top:6px;color:#b34a4a;font-size:9px}
.nameButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.nameButtons button{height:44px;border-radius:13px;font-weight:900;cursor:pointer}
.saveName{border:0;background:#087da9;color:#fff}
.cancelName{border:1px solid #dbeaf0;background:#fff;color:#607984}

@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<main class="app">
  <div class="top">
    <div class="brand">حسابي</div>
    <a class="back" href="shorts.html">‹</a>
  </div>

  <section class="profile">
    <div class="avatar" id="avatar">ز</div>
    <label class="pick">اختيار صورة الحساب<input id="photo" type="file" accept="image/*" hidden></label>

    <div class="nameRow">
      <div class="name" id="profileName">حساب زاد</div>
      <button class="editName" id="editName" type="button" aria-label="تعديل الاسم">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
      </button>
    </div>

    <div class="sub">الاسم والصورة محفوظان على هذا الجهاز ويُستخدم الاسم عند كتابة التعليقات</div>

    <div class="stats">
      <div class="stat"><b id="points">0</b><span>نقاط النشاط</span></div>
      <div class="stat"><b id="savedCount">0</b><span>المحفوظة</span></div>
      <div class="stat"><b id="offlineCount">0</b><span>بدون شبكة</span></div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-tab="saved">المقاطع المفضلة</button>
    <button class="tab" data-tab="liked">الإعجابات</button>
    <button class="tab" data-tab="offline">بدون شبكة</button>
  </div>

  <section class="grid" id="grid"></section>
</main>

<nav class="bottom">
  <div class="bottomin">
    <a class="nav" href="index.html">الرئيسية</a>
    <a class="nav" href="shorts.html">المقاطع</a>
    <a class="nav active" href="account.html">حسابي</a>
  </div>
</nav>

<div class="nameModal" id="nameModal">
  <form class="nameCard" id="nameForm">
    <h3>اسم الحساب</h3>
    <p>هذا الاسم سيظهر في حسابك ويُستخدم تلقائيًا عند إضافة تعليق على المقاطع.</p>
    <input class="nameInput" id="nameInput" maxlength="30" autocomplete="name" placeholder="اكتب اسمك">
    <div class="nameError" id="nameError"></div>
    <div class="nameButtons">
      <button class="saveName" type="submit">حفظ الاسم</button>
      <button class="cancelName" id="cancelName" type="button">إلغاء</button>
    </div>
  </form>
</div>

<script>
const $=s=>document.querySelector(s);

const catalog=(()=>{
  try{return JSON.parse(localStorage.getItem('zaadVideoCatalog')||'[]')}
  catch(e){return[]}
})();

const ids=k=>{
  try{return JSON.parse(localStorage.getItem(k)||'[]')}
  catch(e){return[]}
};

$('#points').textContent=localStorage.getItem('zaadPoints')||0;
$('#savedCount').textContent=ids('zaadSaved').length;

/* الاسم: نفس المفتاح الذي تقرؤه صفحة المقاطع */
function getProfile(){
  try{
    const p=JSON.parse(localStorage.getItem('zaadAccountProfile')||'{}');
    return p&&typeof p==='object'?p:{};
  }catch(e){return{}}
}

function loadName(){
  const p=getProfile();
  const name=String(p.name||'').trim();
  $('#profileName').textContent=name||'حساب زاد';
}

function openNameEditor(){
  const p=getProfile();
  $('#nameInput').value=String(p.name||'');
  $('#nameError').textContent='';
  $('#nameModal').classList.add('show');
  setTimeout(()=>$('#nameInput').focus(),80);
}

function closeNameEditor(){
  $('#nameModal').classList.remove('show');
}

$('#editName').onclick=openNameEditor;
$('#cancelName').onclick=closeNameEditor;
$('#nameModal').onclick=e=>{if(e.target===$('#nameModal'))closeNameEditor()};

$('#nameForm').onsubmit=e=>{
  e.preventDefault();
  const name=$('#nameInput').value.trim().replace(/\s+/g,' ');

  if(name.length<2){
    $('#nameError').textContent='اكتب اسمًا من حرفين على الأقل.';
    return;
  }

  const p=getProfile();
  p.name=name;
  localStorage.setItem('zaadAccountProfile',JSON.stringify(p));

  // توافق إضافي مع أي نسخة قديمة من صفحة المقاطع
  localStorage.setItem('zaadAccountName',name);

  loadName();
  closeNameEditor();
};

/* الصورة */
function loadAvatar(){
  const v=localStorage.getItem('zaadProfileAvatar');
  $('#avatar').innerHTML=v?`<img src="${v}" alt="صورة الحساب">`:'ز';
}
loadAvatar();
loadName();

$('#photo').onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;

  if(!f.type.startsWith('image/'))return;

  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const m=320;
      const sc=Math.min(1,m/Math.max(img.width,img.height));
      c.width=Math.max(1,Math.round(img.width*sc));
      c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);

      try{
        localStorage.setItem('zaadProfileAvatar',c.toDataURL('image/jpeg',.78));
        loadAvatar();
      }catch(err){
        alert('تعذر حفظ الصورة. جرّب صورة أصغر.');
      }
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
};

/* المقاطع بدون شبكة */
function openDB(){
  return new Promise((a,b)=>{
    const r=indexedDB.open('zaadOfflineDB',1);
    r.onupgradeneeded=()=>{
      if(!r.result.objectStoreNames.contains('videos'))
        r.result.createObjectStore('videos',{keyPath:'id'});
    };
    r.onsuccess=()=>a(r.result);
    r.onerror=()=>b(r.error);
  });
}

async function offline(){
  try{
    const db=await openDB();
    return await new Promise(r=>{
      const q=db.transaction('videos','readonly').objectStore('videos').getAll();
      q.onsuccess=()=>r(q.result||[]);
      q.onerror=()=>r([]);
    });
  }catch(e){return[]}
}

function esc(v){
  const d=document.createElement('div');
  d.textContent=v||'';
  return d.innerHTML;
}

function cards(list,offlineMode=false){
  $('#grid').innerHTML=list.length
    ?list.map(v=>`
      <a class="card" href="${offlineMode?'offline.html?id='+encodeURIComponent(v.id):'shorts.html'}">
        <div class="thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="4" y="3" width="16" height="18" rx="4"/>
            <path d="m10 9 5 3-5 3Z"/>
          </svg>
        </div>
        <div class="ct">
          <b>${esc(v.title)}</b>
          <span>${esc(v.publisher||'زاد')}</span>
        </div>
      </a>`).join('')
    :'<div class="empty">لا توجد مقاطع هنا حتى الآن.</div>';
}

async function show(tab){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));

  if(tab==='offline'){
    const a=await offline();
    $('#offlineCount').textContent=a.length;
    cards(a,true);
    return;
  }

  const set=new Set(ids(tab==='saved'?'zaadSaved':'zaadLikes'));
  cards(catalog.filter(v=>set.has(v.id)));
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
offline().then(a=>$('#offlineCount').textContent=a.length);
show('saved');

if('serviceWorker'in navigator&&location.protocol!=='file:')
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
</body>
</html>
