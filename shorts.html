<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>المقاطع | زاد</title>

<style>
:root{
    --primary:#28b6eb;
    --primary-dark:#087da9;
    --glass:rgba(4,17,23,.52);
    --border:rgba(255,255,255,.16);
    --app-height:100dvh;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Tahoma,Arial,sans-serif;
    overscroll-behavior:none;
}

body{
    -webkit-user-select:none;
    user-select:none;
}

button,
a{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    position:relative;
    width:100%;
    height:var(--app-height);
    overflow:hidden;
    background:#000;
}

/* =========================
   FEED
========================= */

.feed{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

.short{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;

    transform:translate3d(0,100%,0);

    transition:
        transform 320ms
        cubic-bezier(.22,.61,.36,1);

    will-change:transform;
    backface-visibility:hidden;
}

.short.current{
    transform:translate3d(0,0,0);
    z-index:3;
}

.short.previous{
    transform:translate3d(0,-100%,0);
    z-index:2;
}

.short.next{
    transform:translate3d(0,100%,0);
    z-index:2;
}

.short video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;
}

.videoShade{
    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.20) 0%,
            rgba(0,0,0,.04) 40%,
            rgba(0,0,0,.17) 62%,
            rgba(0,0,0,.91) 100%
        );
}

/* =========================
   MOVING VIDEO INFORMATION
========================= */

.videoContent{
    position:absolute;
    z-index:8;

    right:16px;
    left:84px;

    bottom:
        calc(
            78px
            + env(safe-area-inset-bottom)
        );

    color:white;

    text-shadow:
        0 2px 12px
        rgba(0,0,0,.55);

    pointer-events:none;
}

.publisher{
    display:flex;
    align-items:center;
    gap:9px;
    margin-bottom:9px;
}

.publisherAvatar{
    width:37px;
    height:37px;
    border-radius:50%;

    display:grid;
    place-items:center;

    flex:none;

    font-size:14px;
    font-weight:900;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );

    border:1px solid rgba(255,255,255,.32);
}

.publisherName{
    font-size:13px;
    font-weight:bold;
}

.publisherCategory{
    margin-top:3px;
    font-size:9px;
    color:#d1eaf4;
}

.videoTitle{
    margin-bottom:5px;

    font-size:16px;
    line-height:1.5;

    font-weight:900;
}

.videoDescription{
    max-width:100%;

    font-size:11px;
    line-height:1.75;

    color:#f2f7f9;

    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;

    overflow:hidden;
}

.sourceInfo{
    display:flex;
    align-items:center;
    gap:5px;

    margin-top:8px;

    width:max-content;
    max-width:100%;

    padding:7px 9px;

    border-radius:9px;

    background:rgba(0,0,0,.34);

    border:1px solid rgba(255,255,255,.13);

    font-size:9px;

    color:#edf7fa;
}

.sourceInfo svg{
    width:13px;
    height:13px;

    stroke:currentColor;
    fill:none;
    stroke-width:2;
}

/* =========================
   FIXED HEADER
========================= */

.fixedHeader{
    position:absolute;

    z-index:50;

    top:0;
    right:0;
    left:0;

    padding:
        calc(
            env(safe-area-inset-top)
            + 10px
        )
        14px
        8px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.brand{
    display:flex;
    align-items:center;
    gap:9px;

    color:white;

    font-size:18px;
    font-weight:900;

    pointer-events:auto;
}

.brandLogo{
    width:39px;
    height:39px;

    border-radius:13px;

    display:grid;
    place-items:center;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.26);
}

.fixedHeaderActions{
    display:flex;
    gap:7px;

    pointer-events:auto;
}

.glassButton{
    width:41px;
    height:41px;

    border-radius:13px;

    display:grid;
    place-items:center;

    border:1px solid var(--border);

    color:white;

    background:var(--glass);

    backdrop-filter:blur(13px);
    -webkit-backdrop-filter:blur(13px);
}

.glassButton svg{
    width:20px;
    height:20px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   FIXED CATEGORIES
========================= */

.fixedCategories{
    position:absolute;

    z-index:49;

    top:
        calc(
            env(safe-area-inset-top)
            + 61px
        );

    right:0;
    left:0;

    display:flex;
    gap:7px;

    padding:7px 14px 10px;

    overflow-x:auto;

    scrollbar-width:none;

    touch-action:pan-x;
}

.fixedCategories::-webkit-scrollbar{
    display:none;
}

.categoryButton{
    flex:none;

    border-radius:999px;

    padding:8px 14px;

    border:1px solid var(--border);

    color:white;

    background:
        rgba(5,17,23,.38);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    font-size:11px;

    white-space:nowrap;
}

.categoryButton.active{
    background:white;
    color:#062d40;
    border-color:white;
    font-weight:bold;
}

/* =========================
   FIXED SIDE ACTIONS
========================= */

.fixedActions{
    position:absolute;

    z-index:52;

    left:12px;

    bottom:
        calc(
            82px
            + env(safe-area-inset-bottom)
        );

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:13px;
}

.actionItem{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:4px;

    color:white;

    font-size:8px;
}

.actionButton{
    width:46px;
    height:46px;

    border-radius:50%;

    display:grid;
    place-items:center;

    border:1px solid rgba(255,255,255,.17);

    color:white;

    background:
        rgba(4,17,23,.50);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    transition:.15s;
}

.actionButton:active{
    transform:scale(.88);
}

.actionButton svg{
    width:21px;
    height:21px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.actionItem.active .actionButton{
    background:white;
    color:var(--primary-dark);
}

/* =========================
   FIXED BOTTOM NAV
========================= */

.fixedBottomNav{
    position:absolute;

    z-index:55;

    right:0;
    left:0;
    bottom:0;

    height:
        calc(
            64px
            + env(safe-area-inset-bottom)
        );

    padding-bottom:
        env(safe-area-inset-bottom);

    display:grid;
    grid-template-columns:repeat(5,1fr);

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.92)
        );
}

.navItem{
    border:0;

    background:none;

    color:#cbd9de;

    text-decoration:none;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;

    font-size:8px;
}

.navItem svg{
    width:20px;
    height:20px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.navItem.active{
    color:white;
    font-weight:bold;
}

/* =========================
   VIDEO PROGRESS
========================= */

.videoProgress{
    position:absolute;

    z-index:48;

    right:0;
    left:0;

    bottom:
        calc(
            64px
            + env(safe-area-inset-bottom)
        );

    height:2px;

    background:
        rgba(255,255,255,.16);

    pointer-events:none;
}

.videoProgressFill{
    width:0;
    height:100%;

    background:#fff;
}

/* =========================
   PLAY INDICATOR
========================= */

.playIndicator{
    position:absolute;

    z-index:40;

    top:50%;
    left:50%;

    width:72px;
    height:72px;

    border-radius:50%;

    transform:
        translate(-50%,-50%)
        scale(.85);

    display:grid;
    place-items:center;

    background:rgba(0,0,0,.44);

    color:white;

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    opacity:0;

    pointer-events:none;

    transition:.18s;
}

.playIndicator.show{
    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.playIndicator svg{
    width:28px;
    height:28px;

    stroke:white;
    fill:white;
}

/* =========================
   LOADING
========================= */

.loadingScreen{
    position:absolute;
    inset:0;

    z-index:100;

    display:grid;
    place-items:center;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #133d4d,
            #050d11 70%
        );

    transition:.25s;
}

.loadingScreen.hide{
    opacity:0;
    pointer-events:none;
}

.loaderContent{
    text-align:center;
}

.loaderLogo{
    width:67px;
    height:67px;

    margin:0 auto 15px;

    border-radius:22px;

    display:grid;
    place-items:center;

    color:white;

    font-size:27px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            var(--primary-dark),
            var(--primary)
        );
}

.loaderText{
    font-size:11px;
    color:#c7dce4;
}

/* =========================
   ERROR / EMPTY
========================= */

.messagePage{
    position:absolute;
    inset:0;

    z-index:15;

    display:grid;
    place-items:center;

    padding:30px;

    color:white;

    text-align:center;

    background:
        radial-gradient(
            circle at top,
            #12394a,
            #050d11 68%
        );
}

.messagePage h2{
    margin-bottom:8px;
    font-size:20px;
}

.messagePage p{
    max-width:330px;

    font-size:11px;
    line-height:1.8;

    color:#bfd3db;
}

.retryButton{
    margin-top:15px;

    padding:10px 18px;

    border:0;
    border-radius:12px;

    color:#063045;

    background:white;

    font-weight:bold;
}

/* =========================
   SOURCE MODAL
========================= */

.modal{
    position:fixed;

    z-index:1000;

    inset:0;

    display:none;
    align-items:flex-end;
    justify-content:center;

    padding:14px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:blur(5px);
}

.modal.show{
    display:flex;
}

.modalCard{
    width:min(480px,100%);

    padding:20px;

    border-radius:23px;

    background:white;

    color:#15323d;
}

.modalHandle{
    width:43px;
    height:4px;

    margin:0 auto 16px;

    border-radius:999px;

    background:#dce4e7;
}

.modalCard h3{
    margin-bottom:8px;
}

.modalCard p{
    color:#71848c;

    font-size:11px;
    line-height:1.8;
}

.modalButtons{
    margin-top:17px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.modalButton{
    padding:11px;

    border-radius:12px;

    border:1px solid #dfeaec;

    color:#193640;

    background:#f7fbfc;
}

.modalPrimary{
    color:white;
    background:var(--primary-dark);
    border-color:var(--primary-dark);
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    z-index:2000;

    top:
        calc(
            env(safe-area-inset-top)
            + 72px
        );

    left:50%;

    transform:
        translate(-50%,-15px);

    max-width:
        calc(100% - 30px);

    padding:10px 15px;

    border-radius:999px;

    color:#073248;

    background:white;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.25);

    font-size:10px;
    font-weight:bold;

    opacity:0;

    pointer-events:none;

    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   MOBILE SMALL HEIGHT
========================= */

@media(max-height:680px){

    .fixedCategories{
        top:
            calc(
                env(safe-area-inset-top)
                + 53px
            );
    }

    .fixedActions{
        gap:8px;
    }

    .actionButton{
        width:41px;
        height:41px;
    }

    .videoDescription{
        -webkit-line-clamp:1;
    }
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    body{
        background:#061319;
    }

    .app{
        width:500px;
        max-width:100%;

        margin:auto;

        box-shadow:
            0 0 90px
            rgba(0,0,0,.85);
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <!-- الفيديوهات فقط تتحرك -->
    <main
        class="feed"
        id="feed">
    </main>


    <!-- الهيدر ثابت -->
    <header class="fixedHeader">

        <div class="brand">

            <div class="brandLogo">
                ز
            </div>

            <span>
                زاد
            </span>

        </div>


        <div class="fixedHeaderActions">

            <button
                class="glassButton"
                aria-label="تحديث"
                onclick="loadVideos(true)">

                <svg viewBox="0 0 24 24">
                    <path d="M20 11a8 8 0 1 0-2.3 5.7"/>
                    <path d="M20 4v7h-7"/>
                </svg>

            </button>

        </div>

    </header>


    <!-- التصنيفات ثابتة -->
    <div
        class="fixedCategories"
        id="categories">
    </div>


    <!-- أزرار الجانب ثابتة -->
    <aside class="fixedActions">

        <div
            class="actionItem"
            id="likeAction">

            <button
                class="actionButton"
                onclick="toggleLike()">

                <svg viewBox="0 0 24 24">
                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
                </svg>

            </button>

            <span>
                إعجاب
            </span>

        </div>


        <div
            class="actionItem"
            id="saveAction">

            <button
                class="actionButton"
                onclick="toggleSave()">

                <svg viewBox="0 0 24 24">
                    <path d="M6 3h12v18l-6-4-6 4Z"/>
                </svg>

            </button>

            <span>
                حفظ
            </span>

        </div>


        <div class="actionItem">

            <button
                class="actionButton"
                onclick="shareCurrentVideo()">

                <svg viewBox="0 0 24 24">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <path d="m8.6 10.5 6.8-4"/>
                    <path d="m8.6 13.5 6.8 4"/>
                </svg>

            </button>

            <span>
                مشاركة
            </span>

        </div>


        <div class="actionItem">

            <button
                class="actionButton"
                id="soundButton"
                onclick="toggleSound()">

                <svg viewBox="0 0 24 24">
                    <path d="M11 5 6 9H3v6h3l5 4Z"/>
                    <path d="M15 9a4 4 0 0 1 0 6"/>
                    <path d="M17.5 6.5a8 8 0 0 1 0 11"/>
                </svg>

            </button>

            <span>
                الصوت
            </span>

        </div>


        <div class="actionItem">

            <button
                class="actionButton"
                onclick="showSource()">

                <svg viewBox="0 0 24 24">
                    <path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4Z"/>
                    <path d="M8 4v16"/>
                </svg>

            </button>

            <span>
                المصدر
            </span>

        </div>

    </aside>


    <!-- مؤشر التقدم ثابت -->
    <div class="videoProgress">

        <div
            class="videoProgressFill"
            id="progressFill">
        </div>

    </div>


    <!-- الشريط السفلي ثابت -->
    <nav class="fixedBottomNav">

        <a
            href="index.html"
            class="navItem">

            <svg viewBox="0 0 24 24">
                <path d="M3 10.5 12 3l9 7.5"/>
                <path d="M5 9.5V21h14V9.5"/>
                <path d="M9 21v-7h6v7"/>
            </svg>

            <span>
                الرئيسية
            </span>

        </a>


        <button
            class="navItem active">

            <svg viewBox="0 0 24 24">
                <rect x="4" y="3" width="16" height="18" rx="4"/>
                <path d="m10 9 5 3-5 3Z"/>
            </svg>

            <span>
                المقاطع
            </span>

        </button>


        <button
            class="navItem"
            onclick="showToast('قسم القرآن قريبًا')">

            <svg viewBox="0 0 24 24">
                <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22Z"/>
                <path d="M20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22Z"/>
            </svg>

            <span>
                القرآن
            </span>

        </button>


        <button
            class="navItem"
            onclick="showToast('قسم الأذكار قريبًا')">

            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8"/>
                <path d="M12 7v5l3 2"/>
            </svg>

            <span>
                الأذكار
            </span>

        </button>


        <button
            class="navItem"
            onclick="showToast('قسم حسابي قريبًا')">

            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21a8 8 0 0 1 16 0"/>
            </svg>

            <span>
                حسابي
            </span>

        </button>

    </nav>


    <!-- أيقونة تشغيل/إيقاف -->
    <div
        class="playIndicator"
        id="playIndicator">

        <svg viewBox="0 0 24 24">
            <path d="m8 5 11 7-11 7Z"/>
        </svg>

    </div>


    <!-- التحميل -->
    <div
        class="loadingScreen"
        id="loadingScreen">

        <div class="loaderContent">

            <div class="loaderLogo">
                ز
            </div>

            <div class="loaderText">
                جاري تحميل المقاطع...
            </div>

        </div>

    </div>

</div>


<!-- المصدر -->

<div
    class="modal"
    id="sourceModal"
    onclick="closeSourceBackground(event)">

    <div class="modalCard">

        <div class="modalHandle"></div>

        <h3>
            مصدر المقطع
        </h3>

        <p id="sourceText">
            لا يوجد مصدر مضاف.
        </p>

        <div class="modalButtons">

            <button
                class="modalButton"
                onclick="closeSource()">

                إغلاق

            </button>

            <button
                class="modalButton modalPrimary"
                id="sourceOpenButton"
                onclick="openSource()">

                فتح المصدر

            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast">
</div>


<script>

/* =====================================================
   GOOGLE SHEETS

   الأعمدة المتوقعة:

   A العنوان
   B الوصف
   C التصنيف
   D رابط الفيديو
   E الناشر
   F المصدر
   G رابط المصدر
   H الحالة

   H:
   yes = يظهر
   no  = مخفي
===================================================== */

const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSx1Vn6B_mZ9qnQe7gJxqJAEhFrmYKQP8YG4VGOmKhR_Be7v8FzVFNLnQKp2XsF3AtG_r_gd9OhxFca/pub?gid=0&single=true&output=csv";


/* =====================================================
   DATA
===================================================== */

let allVideos = [];

let visibleVideos = [];

let currentIndex = 0;

let currentCategory = "all";

let moving = false;

let soundMuted = false;

let liked = readStorageArray(
    "zaadLikes"
);

let saved = readStorageArray(
    "zaadSaved"
);


/* =====================================================
   HEIGHT
===================================================== */

function setAppHeight(){

    const height =
        window.visualViewport
        ?
        window.visualViewport.height
        :
        window.innerHeight;


    document
        .documentElement
        .style
        .setProperty(
            "--app-height",
            Math.round(height) + "px"
        );
}

setAppHeight();

window.addEventListener(
    "resize",
    setAppHeight
);

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        setAppHeight
    );
}


/* =====================================================
   LOAD SHEET
===================================================== */

async function loadVideos(
    manual=false
){

    showLoading(true);


    try{

        /*
            cache bust حتى تظهر تعديلات
            Google Sheets الجديدة بسرعة أكبر
        */

        const url =
            SHEET_URL +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const rows =
            parseCSV(text);


        if(!rows.length){

            throw new Error(
                "EMPTY"
            );

        }


        allVideos =
            convertRowsToVideos(
                rows
            );


        if(
            !allVideos.length
        ){

            renderMessage(
                "لا توجد مقاطع",
                "أضف المقاطع في Google Sheets واجعل الحالة yes."
            );

            showLoading(false);

            return;
        }


        currentIndex = 0;

        renderCategories();

        applyCategory();


        if(manual){

            showToast(
                "تم تحديث المقاطع"
            );
        }

    }
    catch(error){

        console.error(error);


        renderMessage(
            "تعذر تحميل المقاطع",
            "تأكد أن جدول Google Sheets منشور للعامة وأن روابط الفيديو مباشرة."
        );

    }


    showLoading(false);
}


/* =====================================================
   CSV PARSER

   يدعم الفواصل والاقتباسات
===================================================== */

function parseCSV(text){

    const rows = [];

    let row = [];
    let value = "";

    let insideQuotes = false;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const char =
            text[i];


        const next =
            text[i + 1];


        if(char === '"'){

            if(
                insideQuotes &&
                next === '"'
            ){

                value += '"';

                i++;

            }
            else{

                insideQuotes =
                    !insideQuotes;

            }

        }
        else if(
            char === "," &&
            !insideQuotes
        ){

            row.push(value);

            value = "";

        }
        else if(
            (
                char === "\n" ||
                char === "\r"
            )
            &&
            !insideQuotes
        ){

            if(
                char === "\r" &&
                next === "\n"
            ){

                i++;
            }


            row.push(value);

            value = "";


            if(
                row.some(
                    item =>
                        String(item)
                            .trim() !== ""
                )
            ){

                rows.push(row);
            }


            row = [];

        }
        else{

            value += char;
        }
    }


    row.push(value);


    if(
        row.some(
            item =>
                String(item)
                    .trim() !== ""
        )
    ){

        rows.push(row);
    }


    return rows;
}


/* =====================================================
   CONVERT ROWS
===================================================== */

function convertRowsToVideos(
    rows
){

    /*
       أول صف عناوين
    */

    const data =
        rows.slice(1);


    const result = [];


    data.forEach(
        (
            row,
            index
        )=>{

            const title =
                clean(row[0]);

            const description =
                clean(row[1]);

            const category =
                clean(row[2]);

            const videoURL =
                clean(row[3]);

            const publisher =
                clean(row[4]) ||
                "زاد";

            const source =
                clean(row[5]);

            const sourceURL =
                clean(row[6]);

            const status =
                clean(row[7])
                    .toLowerCase();


            /*
                نخفي no / false / 0
            */

            if(
                status === "no" ||
                status === "false" ||
                status === "0" ||
                status === "مخفي"
            ){

                return;
            }


            if(
                !title ||
                !videoURL
            ){

                return;
            }


            result.push({

                id:
                    "sheet_" +
                    index,

                title:
                    title,

                description:
                    description,

                category:
                    normalizeCategory(
                        category
                    ),

                categoryLabel:
                    category ||
                    "محتوى",

                video:
                    normalizeVideoURL(
                        videoURL
                    ),

                publisher:
                    publisher,

                source:
                    source,

                sourceURL:
                    sourceURL
            });

        }
    );


    return result;
}


/* =====================================================
   GOOGLE DRIVE VIDEO URL SUPPORT

   إذا وضعت رابط مشاركة Google Drive
   يحاول تحويله إلى رابط مباشر.
===================================================== */

function normalizeVideoURL(
    url
){

    url = url.trim();


    /*
       مثال:
       https://drive.google.com/file/d/FILE_ID/view
    */

    const driveMatch =
        url.match(
            /drive\.google\.com\/file\/d\/([^/]+)/i
        );


    if(driveMatch){

        const fileId =
            driveMatch[1];


        return (
            "https://drive.google.com/uc?export=download&id=" +
            encodeURIComponent(
                fileId
            )
        );
    }


    /*
       ?id=...
    */

    try{

        const parsed =
            new URL(url);


        if(
            parsed.hostname
                .includes(
                    "drive.google.com"
                )
            &&
            parsed.searchParams.get(
                "id"
            )
        ){

            return (
                "https://drive.google.com/uc?export=download&id=" +
                encodeURIComponent(
                    parsed.searchParams.get(
                        "id"
                    )
                )
            );
        }

    }
    catch(error){}


    return url;
}


/* =====================================================
   CATEGORIES
===================================================== */

function normalizeCategory(
    value
){

    const text =
        String(value || "")
            .trim()
            .toLowerCase();


    if(
        text.includes("قرآن") ||
        text.includes("القران") ||
        text === "quran"
    ){

        return "quran";
    }


    if(
        text.includes("سنة") ||
        text.includes("حديث") ||
        text === "hadith"
    ){

        return "hadith";
    }


    if(
        text.includes("ذكر") ||
        text.includes("أذكار") ||
        text.includes("اذكار")
    ){

        return "adhkar";
    }


    if(
        text.includes("سيرة")
    ){

        return "seerah";
    }


    if(
        text.includes("قصة") ||
        text.includes("قصص")
    ){

        return "stories";
    }


    if(
        text.includes("تعلم") ||
        text.includes("تعلّم")
    ){

        return "learning";
    }


    return "reminders";
}


function categoryLabel(
    category
){

    const labels = {

        all:
            "لك",

        quran:
            "القرآن",

        hadith:
            "السنة",

        adhkar:
            "الأذكار",

        seerah:
            "السيرة",

        reminders:
            "تذكير",

        stories:
            "قصص",

        learning:
            "تعلّم"
    };


    return labels[category]
        || category;
}


function renderCategories(){

    const container =
        document.getElementById(
            "categories"
        );


    const found =
        new Set();


    allVideos.forEach(
        item =>{

            found.add(
                item.category
            );

        }
    );


    const categories =
        [
            "all",
            ...found
        ];


    container.innerHTML =
        categories
            .map(
                category =>`

        <button
            class="
                categoryButton
                ${
                    category ===
                    currentCategory
                    ?
                    "active"
                    :
                    ""
                }
            "
            onclick="
                changeCategory(
                    '${category}'
                )
            ">

            ${
                escapeHTML(
                    categoryLabel(
                        category
                    )
                )
            }

        </button>

        `
            )
            .join("");
}


function changeCategory(
    category
){

    currentCategory =
        category;


    currentIndex =
        0;


    pauseAll();


    renderCategories();

    applyCategory();
}


function applyCategory(){

    if(
        currentCategory ===
        "all"
    ){

        visibleVideos =
            [...allVideos];
    }
    else{

        visibleVideos =
            allVideos.filter(
                item =>
                    item.category ===
                    currentCategory
            );
    }


    renderVideos();
}

/* =====================================================
   CARD POSITIONS
===================================================== */

function getCards(){

    return [
        ...document.querySelectorAll(
            ".short"
        )
    ];
}


function initPositions(){

    const cards =
        getCards();


    cards.forEach(
        (
            card,
            index
        )=>{

            card.classList.remove(
                "previous",
                "current",
                "next"
            );


            card.style.transform =
                "";

            card.style.transition =
                "";


            if(
                index <
                currentIndex
            ){

                card.classList.add(
                    "previous"
                );
            }
            else if(
                index ===
                currentIndex
            ){

                card.classList.add(
                    "current"
                );
            }
            else{

                card.classList.add(
                    "next"
                );
            }

        }
    );
}


function updatePositions(){

    initPositions();

    updateFixedControls();

    playCurrentVideo();
}


/* =====================================================
   CURRENT VIDEO
===================================================== */

function currentItem(){

    return visibleVideos[
        currentIndex
    ] || null;
}


function currentVideo(){

    const cards =
        getCards();


    return (
        cards[
            currentIndex
        ]
        ?.querySelector(
            "video"
        )
        ||
        null
    );
}


/* =====================================================
   VIDEO PLAY
===================================================== */

function playCurrentVideo(){

    const cards =
        getCards();


    cards.forEach(
        (
            card,
            index
        )=>{

            const video =
                card.querySelector(
                    "video"
                );


            if(!video){
                return;
            }


            if(
                index ===
                currentIndex
            ){

                video.muted =
                    soundMuted;


                const promise =
                    video.play();


                if(
                    promise &&
                    promise.catch
                ){

                    promise.catch(
                        ()=>{

                            soundMuted =
                                true;

                            video.muted =
                                true;

                            updateSoundIcon();

                            video.play()
                                .catch(
                                    ()=>{}
                                );
                        }
                    );
                }

            }
            else{

                video.pause();
            }

        }
    );


    updateFixedControls();
}


function pauseAll(){

    document
        .querySelectorAll(
            ".short video"
        )
        .forEach(
            video =>
                video.pause()
        );
}


/* =====================================================
   VIDEO EVENTS
===================================================== */

function bindVideoEvents(){

    document
        .querySelectorAll(
            ".short video"
        )
        .forEach(
            (
                video,
                index
            )=>{

                video.addEventListener(
                    "timeupdate",
                    ()=>{

                        if(
                            index !==
                            currentIndex
                        ){

                            return;
                        }


                        if(
                            !video.duration
                        ){

                            return;
                        }


                        const percentage =
                            (
                                video.currentTime /
                                video.duration
                            )
                            * 100;


                        document
                            .getElementById(
                                "progressFill"
                            )
                            .style
                            .width =
                            percentage +
                            "%";
                    }
                );


                video.addEventListener(
                    "click",
                    ()=>{

                        if(
                            index !==
                            currentIndex
                        ){

                            return;
                        }


                        if(video.paused){

                            video.play()
                                .catch(
                                    ()=>{}
                                );

                            showPlayIndicator(
                                true
                            );
                        }
                        else{

                            video.pause();

                            showPlayIndicator(
                                false
                            );
                        }
                    }
                );

            }
        );
}


/* =====================================================
   FIXED CONTROLS STATE
===================================================== */

function updateFixedControls(){

    const item =
        currentItem();


    const likeAction =
        document.getElementById(
            "likeAction"
        );


    const saveAction =
        document.getElementById(
            "saveAction"
        );


    if(!item){

        likeAction.classList.remove(
            "active"
        );

        saveAction.classList.remove(
            "active"
        );

        return;
    }


    likeAction.classList.toggle(
        "active",
        liked.includes(
            item.id
        )
    );


    saveAction.classList.toggle(
        "active",
        saved.includes(
            item.id
        )
    );


    updateSoundIcon();


    document
        .getElementById(
            "progressFill"
        )
        .style
        .width =
        "0%";
}


/* =====================================================
   NEXT / PREVIOUS
===================================================== */

const TRANSITION_TIME = 320;


function nextVideo(){

    if(moving){
        return;
    }


    if(
        currentIndex >=
        visibleVideos.length - 1
    ){

        edgeBounce(-1);

        return;
    }


    moving = true;

    currentIndex++;


    updatePositions();


    setTimeout(
        ()=>{

            moving = false;

        },
        TRANSITION_TIME
    );
}


function previousVideo(){

    if(moving){
        return;
    }


    if(
        currentIndex <= 0
    ){

        edgeBounce(1);

        return;
    }


    moving = true;

    currentIndex--;


    updatePositions();


    setTimeout(
        ()=>{

            moving = false;

        },
        TRANSITION_TIME
    );
}


/* =====================================================
   DRAG
===================================================== */

let dragging = false;

let startY = 0;

let currentY = 0;

let startTime = 0;


function touchStart(event){

    if(
        moving ||
        event.touches.length !== 1
    ){

        return;
    }


    if(
        event.target.closest(
            "button,a,.fixedCategories,.fixedActions,.fixedBottomNav,.fixedHeader"
        )
    ){

        return;
    }


    dragging = true;


    startY =
        event.touches[0]
            .clientY;


    currentY =
        startY;


    startTime =
        performance.now();
}


function touchMove(event){

    if(!dragging){
        return;
    }


    currentY =
        event.touches[0]
            .clientY;


    let delta =
        currentY -
        startY;


    if(
        currentIndex === 0 &&
        delta > 0
    ){

        delta *= .2;
    }


    if(
        currentIndex ===
        visibleVideos.length - 1 &&
        delta < 0
    ){

        delta *= .2;
    }


    moveCardsWithFinger(
        delta
    );


    event.preventDefault();
}


function touchEnd(){

    if(!dragging){
        return;
    }


    dragging = false;


    const delta =
        currentY -
        startY;


    const elapsed =
        Math.max(
            1,
            performance.now()
            -
            startTime
        );


    const velocity =
        Math.abs(delta) /
        elapsed;


    const threshold =
        Math.min(
            75,
            getHeight() *
            .10
        );


    const flick =
        velocity > .42 &&
        Math.abs(delta) > 25;


    clearInlineTransforms();


    if(
        delta < -threshold ||
        (
            delta < 0 &&
            flick
        )
    ){

        nextVideo();
    }
    else if(
        delta > threshold ||
        (
            delta > 0 &&
            flick
        )
    ){

        previousVideo();
    }
    else{

        updatePositions();
    }
}


function moveCardsWithFinger(
    delta
){

    const cards =
        getCards();


    const current =
        cards[
            currentIndex
        ];


    const previous =
        cards[
            currentIndex - 1
        ];


    const next =
        cards[
            currentIndex + 1
        ];


    const height =
        getHeight();


    if(current){

        current.style.transition =
            "none";


        current.style.transform =
            `translate3d(
                0,
                ${delta}px,
                0
            )`;
    }


    if(
        delta < 0 &&
        next
    ){

        next.style.transition =
            "none";


        next.style.transform =
            `translate3d(
                0,
                ${height + delta}px,
                0
            )`;
    }


    if(
        delta > 0 &&
        previous
    ){

        previous.style.transition =
            "none";


        previous.style.transform =
            `translate3d(
                0,
                ${-height + delta}px,
                0
            )`;
    }
}


function clearInlineTransforms(){

    getCards()
        .forEach(
            card =>{

                card.style.transition =
                    "";

                card.style.transform =
                    "";
            }
        );
}


function getHeight(){

    return (
        window.visualViewport
        ?.height
        ||
        window.innerHeight
    );
}


/* =====================================================
   EDGE
===================================================== */

function edgeBounce(
    direction
){

    const card =
        getCards()[
            currentIndex
        ];


    if(!card){
        return;
    }


    card.style.transition =
        "transform 120ms ease";


    card.style.transform =
        `translate3d(
            0,
            ${direction * 16}px,
            0
        )`;


    setTimeout(
        ()=>{

            card.style.transform =
                "translate3d(0,0,0)";


            setTimeout(
                ()=>{

                    card.style.transition =
                        "";

                    card.style.transform =
                        "";
                },
                130
            );

        },
        120
    );
}


/* =====================================================
   MOUSE WHEEL
===================================================== */

let wheelLocked = false;

let wheelAmount = 0;

let wheelTimer;


function wheelNavigation(
    event
){

    event.preventDefault();


    if(wheelLocked){
        return;
    }


    wheelAmount +=
        event.deltaY;


    clearTimeout(
        wheelTimer
    );


    wheelTimer =
        setTimeout(
            ()=>{

                wheelAmount =
                    0;
            },
            150
        );


    if(
        Math.abs(
            wheelAmount
        ) < 45
    ){

        return;
    }


    wheelLocked = true;


    if(
        wheelAmount > 0
    ){

        nextVideo();
    }
    else{

        previousVideo();
    }


    wheelAmount = 0;


    setTimeout(
        ()=>{

            wheelLocked =
                false;

        },
        390
    );
}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(){

    const item =
        currentItem();


    if(!item){
        return;
    }


    if(
        liked.includes(
            item.id
        )
    ){

        liked =
            liked.filter(
                id =>
                    id !== item.id
            );
    }
    else{

        liked.push(
            item.id
        );
    }


    localStorage.setItem(
        "zaadLikes",
        JSON.stringify(
            liked
        )
    );


    updateFixedControls();
}


/* =====================================================
   SAVE
===================================================== */

function toggleSave(){

    const item =
        currentItem();


    if(!item){
        return;
    }


    if(
        saved.includes(
            item.id
        )
    ){

        saved =
            saved.filter(
                id =>
                    id !== item.id
            );


        showToast(
            "تم إلغاء الحفظ"
        );

    else{

            item.id
        );

            points
        );


        showToast(
            "تم الحفظ +2 نقطة نشاط"
        );
    }


    localStorage.setItem(
        "zaadSaved",
        JSON.stringify(
            saved
        )
    );


    updateFixedControls();
}


/* =====================================================
   SOUND
===================================================== */

function toggleSound(){

    soundMuted =
        !soundMuted;


    const video =
        currentVideo();


    if(video){

        video.muted =
            soundMuted;


        if(!soundMuted){

            video.play()
                .catch(
                    ()=>{

                        soundMuted =
                            true;

                        video.muted =
                            true;

                        showToast(
                            "اضغط على الفيديو لتفعيل الصوت"
                        );
                    }
                );
        }
    }


    updateSoundIcon();
}


function updateSoundIcon(){

            "soundButton"
        );


    if(soundMuted){

        button.innerHTML = `

        <svg viewBox="0 0 24 24">

            <path d="M11 5 6 9H3v6h3l5 4Z"/>

            <path d="m16 9 5 6"/>

            <path d="m21 9-5 6"/>

        </svg>

        `;

    }
    else{

        button.innerHTML = `

        <svg viewBox="0 0 24 24">

            <path d="M11 5 6 9H3v6h3l5 4Z"/>

            <path d="M15 9a4 4 0 0 1 0 6"/>

            <path d="M17.5 6.5a8 8 0 0 1 0 11"/>

        </svg>

        `;
    }
}


/* =====================================================
   SHARE
===================================================== */

async function shareCurrentVideo(){

    const item =
        currentItem();


    if(!item){
        return;
    }


    const text =
        item.title
        +
        (
            item.description
            ?
            "\n\n" +
            item.description
            :
            ""
        )
        +
        (
            item.source
            ?
            "\n\nالمصدر: " +
            item.source
            :
            ""
        );


    if(navigator.share){

        try{

            await navigator.share({
                title:
                    item.title,

                text:
                    text
            });

        }
        catch(error){}

    }
    else{

        try{

            await navigator
                .clipboard
                .writeText(
                    text
                );


            showToast(
                "تم نسخ معلومات المقطع"
            );

        }
        catch(error){

            showToast(
                "تعذرت المشاركة"
            );
        }
    }
}


/* =====================================================
   SOURCE
===================================================== */

function showSource(){

    const item =
        currentItem();


    if(!item){
        return;
    }


    pauseAll();


    document
        .getElementById(
            "sourceText"
        )
        .textContent =
        item.source ||
        "لم يتم إضافة مصدر لهذا المقطع.";


    const button =
        document.getElementById(
            "sourceOpenButton"
        );


    button.style.display =
        item.sourceURL
        ?
        "block"
        :
        "none";


    document
        .getElementById(
            "sourceModal"
        )
        .classList
        .add(
            "show"
        );
}


function closeSource(){

    document
        .getElementById(
            "sourceModal"
        )
        .classList
        .remove(
            "show"
        );


    playCurrentVideo();
}


function closeSourceBackground(
    event
){

    if(
        event.target.id ===
        "sourceModal"
    ){

        closeSource();
    }
}


function openSource(){

    const item =
        currentItem();


    if(
        !item ||
        !item.sourceURL
    ){

        return;
    }


    try{

        const url =
            new URL(
                item.sourceURL
            );


        if(
            url.protocol !== "https:" &&
            url.protocol !== "http:"
        ){

            throw new Error();
        }


        window.open(
            url.href,
            "_blank",
            "noopener,noreferrer"
        );

    }
    catch(error){

        showToast(
            "رابط المصدر غير صحيح"
        );
    }
}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    event =>{

        if(
            event.key ===
            "ArrowDown"
        ){

            nextVideo();
        }


        if(
            event.key ===
            "ArrowUp"
        ){

            previousVideo();
        }


        if(
            event.key === " "
        ){

            event.preventDefault();


            const video =
                currentVideo();


            if(!video){
                return;
            }


            if(video.paused){

                video.play()
                    .catch(
                        ()=>{}
                    );

                showPlayIndicator(
                    true
                );
            }
            else{

                video.pause();

                showPlayIndicator(
                    false
                );
            }
        }

    }
);


/* =====================================================
   PLAY INDICATOR
===================================================== */

let playIndicatorTimer;


function showPlayIndicator(
    playing
){

    const element =
        document.getElementById(
            "playIndicator"
        );


    element.innerHTML =
        playing
        ?
        `

        <svg viewBox="0 0 24 24">
            <path d="m8 5 11 7-11 7Z"/>
        </svg>

        `
        :
        `

        <svg viewBox="0 0 24 24">
            <path d="M9 5v14"/>
            <path d="M15 5v14"/>
        </svg>

        `;


    element.classList.add(
        "show"
    );


    clearTimeout(
        playIndicatorTimer
    );


    playIndicatorTimer =
        setTimeout(
            ()=>{

                element
                    .classList
                    .remove(
                        "show"
                    );

            },
            430
        );
}


/* =====================================================
   MESSAGE
===================================================== */

function renderMessage(
    title,
    message
){

    document
        .getElementById(
            "feed"
        )
        .innerHTML = `

        <div class="messagePage">

            <div>

                <h2>
                    ${escapeHTML(title)}
                </h2>

                <p>
                    ${escapeHTML(message)}
                </p>

                <button
                    class="retryButton"
                    onclick="loadVideos(true)">

                    إعادة المحاولة

                </button>

            </div>

        </div>

        `;
}


/* =====================================================
   LOADING
===================================================== */

function showLoading(
    show
){

    const element =
        document.getElementById(
            "loadingScreen"
        );


    if(show){

        element
            .classList
            .remove(
                "hide"
            );
    }
    else{

        element
            .classList
            .add(
                "hide"
            );
    }
}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{

                toast
                    .classList
                    .remove(
                        "show"
                    );

            },
            1700
        );
}


/* =====================================================
   STORAGE
===================================================== */

function readStorageArray(
    key
){

    try{

        const value =
            JSON.parse(
                localStorage.getItem(
                    key
                ) || "[]"
            );


        return Array.isArray(value)
            ?
            value
            :
            [];
    }
    catch(error){

        return [];
    }
}


/* =====================================================
   HELPERS
===================================================== */

function clean(value){

    return String(
        value ?? ""
    ).trim();
}


function escapeHTML(
    value
){

    const element =
        document.createElement(
            "div"
        );


    element.textContent =
        String(value ?? "");


    return element.innerHTML;
}


function safeAttribute(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#39;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    );
}


/* =====================================================
   TOUCH
===================================================== */

const feed =
    document.getElementById(
        "feed"
    );


feed.addEventListener(
    "touchstart",
    touchStart,
    {
        passive:true
    }
);


feed.addEventListener(
    "touchmove",
    touchMove,
    {
        passive:false
    }
);


feed.addEventListener(
    "touchend",
    touchEnd,
    {
        passive:true
    }
);


feed.addEventListener(
    "touchcancel",
    touchEnd,
    {
        passive:true
    }
);


feed.addEventListener(
    "wheel",
    wheelNavigation,
    {
        passive:false
    }
);


/* =====================================================
   PREVENT ZOOM
===================================================== */

document.addEventListener(
    "gesturestart",
    event =>
        event.preventDefault()
);


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(document.hidden){

            pauseAll();
        }
        else{

            playCurrentVideo();
        }

    }
);


/* =====================================================
   START
===================================================== */

loadVideos();

</script>
